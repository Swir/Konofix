name: Temporary clean-exit patch runner

on:
  push:
    branches:
      - codex/network-session-clean-exit

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply deterministic lifecycle patch
        run: python scripts/apply-clean-exit-patch.py
      - name: Verify focused lifecycle policy
        run: |
          npm ci
          node scripts/check-network-session-lifecycle.mjs
          node scripts/test-network-session-lifecycle.mjs
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Remove temporary helpers and verify final tree audit
        run: |
          git rm .github/workflows/temporary-apply-clean-exit.yml scripts/apply-clean-exit-patch.py
          npm run audit
      - name: Commit verified patch
        run: |
          git config user.name "Wojciech"
          git config user.email "swirjestem@hotmail.com"
          git add src-tauri/src/lib.rs scripts/check-network-session-lifecycle.mjs scripts/test-network-session-lifecycle.mjs docs/NETWORK_SESSION_LIFECYCLE.md CHANGELOG.md ROADMAP.md
          git diff --cached --check
          git commit -m "Clear owned session state after every network-task exit"
          git push origin HEAD:codex/network-session-clean-exit
