name: Temporary clean public-host PR artifacts

on:
  push:
    branches:
      - hardening/public-host-policy-86

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Remove generated build artifacts and verify policy
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch node-linux/target
          if ! grep -qxF 'node-linux/target/' .gitignore; then
            printf '\nnode-linux/target/\n' >> .gitignore
          fi
          node scripts/test-node-public-host-policy.mjs
          node scripts/check-node-public-host-policy.mjs
          git diff --check

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-clean-public-host-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean generated Linux test artifacts"
          git push origin HEAD:hardening/public-host-policy-86
