name: Temporary finalize public-host policy

on:
  push:
    branches:
      - hardening/public-host-policy-86

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Finalize formatting and documentation
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          python - <<'PY'
          from pathlib import Path

          def add_after(path, needle, addition):
              p = Path(path)
              text = p.read_text(encoding='utf-8').replace('\r\n','\n')
              if addition.strip() in text:
                  return
              if needle not in text:
                  raise SystemExit(f'{path}: anchor not found')
              text = text.replace(needle, needle + addition, 1)
              p.write_text(text, encoding='utf-8')

          add_after(
              'docs/NODE.md',
              '- automatic generation of ready-to-use public multiaddresses\n',
              '- raw-binary fail-closed validation for non-global IPv4/IPv6 literals, with an explicit lab-only override\n',
          )
          add_after(
              'docs/NODE.md',
              '```powershell\nsrc-tauri\\target\\release\\konofix-node.exe --port 45555 --public-host YOUR_PUBLIC_IP\n```\n',
              '\nRaw `konofix-node --public-host` now rejects non-global/special-use IP literals before printing public bootstrap addresses. The boundary covers private, loopback, link-local, CGNAT, documentation, benchmarking, multicast/reserved and reviewed IPv6 special-use ranges. `--allow-private-address` is an explicit controlled-lab override only; its output is labelled **LAB ONLY / NOT VALID PUBLIC-NODE EVIDENCE**. DNS names remain supported, but raw syntax acceptance alone is not reachability evidence; use the deployment/readiness tooling for promotion evidence.\n',
          )
          add_after(
              'docs/NODE_LINUX.md',
              'The Linux deployment preflight uses the same fail-closed public-host policy as the Windows readiness/evidence tooling. Literal addresses must be globally routable, while DNS names must be public-looking FQDNs and cannot live below special/private-use namespaces such as `localhost`, `.local`, `.test`, `.example`, `example.com`, `example.net`, `example.org`, `.onion`, `.alt`, `.arpa`, or `.internal`. With `--require-dns-resolution`, every compatible DNS answer must also be globally routable.\n',
              '\nDirect invocation of `konofix-node` now fails closed for non-global/special-use IP literals too. `--allow-private-address` exists only for controlled lab use and labels the resulting bootstrap output as not valid public-node evidence; DNS promotion evidence must still pass the installer/readiness resolution checks.\n',
          )
          add_after(
              'CHANGELOG.md',
              '## 0.4.2\n\n',
              '- made raw `konofix-node --public-host` fail closed for non-global IPv4/IPv6 literals before any public bootstrap addresses are printed; the reviewed policy covers private/local, CGNAT, documentation, benchmarking, multicast/reserved and IPv6 special-use ranges, keeps DNS names supported, adds an explicit `--allow-private-address` lab override with non-evidence labelling, forwards that lab intent through Windows/Linux launchers, and adds Rust plus adversarial policy coverage without changing Real Internet Test credit,\n',
          )
          add_after(
              'ROADMAP.md',
              '- Public-Node readiness now fails closed when a literal bootstrap endpoint is private, CGNAT, loopback/link-local, documentation-only, benchmark/reserved/ORCHID or otherwise non-global; DNS endpoints must be public-looking FQDNs and, for readiness evidence, resolve only to globally routable addresses. Readiness schema v2 records the resolved-address evidence while still refusing to claim a QUIC handshake that was not actually performed.\n',
              '- Raw `konofix-node --public-host` invocation now follows a fail-closed literal-IP boundary too: non-global/special-use IPv4/IPv6 literals are rejected before shareable bootstrap output unless the operator opts into the explicit lab-only override, which is visibly marked as not valid public-node evidence. DNS names remain supported and real reachability still requires the existing deployment/readiness evidence gates. This defense-in-depth hardening does not add Real Internet Test credit.\n',
          )
          PY

      - name: Verify policy, documentation and source
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          node scripts/test-node-public-host-policy.mjs
          node scripts/check-node-public-host-policy.mjs
          npm run audit
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --locked --manifest-path node-linux/Cargo.toml --bin konofix-node
          git diff --check

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-finalize-public-host-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize public-host policy hardening"
          git push origin HEAD:hardening/public-host-policy-86
