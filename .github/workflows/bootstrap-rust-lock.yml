name: Bootstrap Rust lockfile

on:
  push:
    branches: [ automation/node-state-safety ]
    paths:
      - '.github/workflows/bootstrap-rust-lock.yml'

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: x86_64-pc-windows-msvc
          toolchain: stable

      - name: Generate and verify Rust lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
          if (-not (Test-Path 'src-tauri/Cargo.lock' -PathType Leaf)) { throw 'Cargo.lock was not generated.' }

      - name: Commit verified lockfile and remove bootstrap workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          git rm .github/workflows/bootstrap-rust-lock.yml
          git commit -m 'build: commit verified Rust dependency lockfile'
          git push origin HEAD:automation/node-state-safety
