name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: x86_64-pc-windows-msvc
          toolchain: stable
          components: rustfmt

      - name: Release metadata gate
        shell: pwsh
        run: .\scripts\release-gate.ps1

      - name: Network evidence gate self-tests
        shell: pwsh
        run: .\scripts\test-network-evidence-gate.ps1

      - name: Internet bootstrap precheck self-tests
        shell: pwsh
        run: .\scripts\test-internet-precheck.ps1

      - name: Public Node deployment self-tests
        shell: pwsh
        run: .\scripts\test-public-node.ps1

      - name: Public Node readiness self-tests
        shell: pwsh
        run: .\scripts\test-public-node-readiness.ps1

      - name: Node health validator self-tests
        shell: pwsh
        run: .\scripts\test-node-health.ps1

      - name: Node soak stability self-tests
        shell: pwsh
        run: .\scripts\test-node-soak.ps1

      - name: Node soak collector self-tests
        shell: pwsh
        run: .\scripts\test-node-soak-collector.ps1

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Project consistency and localization audit
        run: npm run audit

      - name: TypeScript + Vite build
        run: npm run build

      - name: Rust lockfile metadata gate
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo test - all targets
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Cargo check - Konofix Chat
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Cargo check - Konofix Node
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --bin konofix-node

      - name: Build production Windows app
        run: npm run tauri build

      - name: Build production Konofix Node
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release --bin konofix-node

      - name: Stage Windows test bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          New-Item -ItemType Directory -Force -Path 'artifact\scripts' | Out-Null
          Copy-Item 'src-tauri\target\release\konofix-node.exe' 'artifact\konofix-node.exe'
          if (-not (Test-Path 'src-tauri\target\release\bundle' -PathType Container)) { throw 'Tauri Windows bundle directory is missing.' }
          Copy-Item 'src-tauri\target\release\bundle' 'artifact\bundle' -Recurse -Force
          Copy-Item 'README.md' 'artifact\README.md'
          Copy-Item 'docs\TESTING.md' 'artifact\TESTING.md'
          Copy-Item 'docs\NODE.md' 'artifact\NODE.md'
          Copy-Item 'docs\NODE_SOAK.md' 'artifact\NODE_SOAK.md'
          Copy-Item 'docs\RELEASE_0.4.2_TEST1.md' 'artifact\RELEASE_NOTES.md'

          $testTools = @(
            'internet-test.ps1',
            'public-node.ps1',
            'check-public-node-readiness.ps1',
            'new-network-test-report.ps1',
            'validate-network-test-report.ps1',
            'check-node-health.ps1',
            'collect-node-soak.ps1',
            'validate-node-soak.ps1'
          )
          foreach ($tool in $testTools) {
            Copy-Item (Join-Path 'scripts' $tool) (Join-Path 'artifact\scripts' $tool)
          }

          if (-not (Test-Path 'package-lock.json' -PathType Leaf)) { throw 'Committed package-lock.json is missing.' }
          Copy-Item 'package-lock.json' 'artifact\package-lock.json'
          if (-not (git ls-files --error-unmatch -- 'src-tauri/Cargo.lock' 2>$null)) { throw 'Committed src-tauri/Cargo.lock is missing from Git tracking.' }
          if (-not (Test-Path 'src-tauri\Cargo.lock' -PathType Leaf)) { throw 'Committed src-tauri/Cargo.lock is missing from the build workspace.' }
          Copy-Item 'src-tauri\Cargo.lock' 'artifact\Cargo.lock'

          $artifactRoot = (Resolve-Path 'artifact').Path
          $nodePath = Join-Path $artifactRoot 'konofix-node.exe'
          $frontendLockPath = Join-Path $artifactRoot 'package-lock.json'
          $cargoLockPath = Join-Path $artifactRoot 'Cargo.lock'
          $installerFiles = @(Get-ChildItem (Join-Path $artifactRoot 'bundle') -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.msi') })
          if ($installerFiles.Count -eq 0) { throw 'No Windows installer was produced by the Tauri build.' }
          $toolFiles = @(Get-ChildItem (Join-Path $artifactRoot 'scripts') -File)
          if ($toolFiles.Count -ne $testTools.Count) { throw 'Windows test bundle is missing one or more operator/test scripts.' }

          $installerInfo = @($installerFiles | ForEach-Object {
            [ordered]@{
              path = [IO.Path]::GetRelativePath($artifactRoot, $_.FullName).Replace('\', '/')
              bytes = [int64]$_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $toolInfo = @($toolFiles | Sort-Object Name | ForEach-Object {
            [ordered]@{
              path = [IO.Path]::GetRelativePath($artifactRoot, $_.FullName).Replace('\', '/')
              bytes = [int64]$_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $buildInfo = [ordered]@{
            schema = 1
            product = 'Konofix Chat'
            version = [string]$package.version
            commit = [string]$env:GITHUB_SHA
            workflow_run = [string]$env:GITHUB_RUN_ID
            generated_utc = [DateTimeOffset]::UtcNow.ToString('o')
            node = [ordered]@{
              path = 'konofix-node.exe'
              bytes = [int64](Get-Item $nodePath).Length
              sha256 = (Get-FileHash $nodePath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            frontend_lock = [ordered]@{
              path = 'package-lock.json'
              bytes = [int64](Get-Item $frontendLockPath).Length
              sha256 = (Get-FileHash $frontendLockPath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            rust_lock = [ordered]@{
              path = 'Cargo.lock'
              bytes = [int64](Get-Item $cargoLockPath).Length
              sha256 = (Get-FileHash $cargoLockPath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            installers = $installerInfo
            tools = $toolInfo
          }
          $buildInfo | ConvertTo-Json -Depth 6 | Set-Content 'artifact\BUILD_INFO.json' -Encoding utf8
          Get-ChildItem artifact -Recurse | Select-Object FullName, Length

      - name: Create release ZIP and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'Konofix-Chat-0.4.2-test1-Windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'artifact\*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Verify release artifact integrity
        shell: pwsh
        run: .\scripts\verify-release.ps1

      - name: Upload Windows test bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Konofix-Chat-0.4.2-Windows-${{ github.sha }}
          path: |
            artifact
            Konofix-Chat-0.4.2-test1-Windows.zip
            Konofix-Chat-0.4.2-test1-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 14
