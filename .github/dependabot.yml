version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
      frontend-major:
        update-types:
          - "major"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"
      rust-major:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      github-actions:
        patterns:
          - "*"
