name: Issue 95 integration

on:
  push:
    branches:
      - 'hardening/nickname-lease-auth-95'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply hardening
        run: |
          python scripts/issue95-apply.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-nickname-lease-auth.mjs')
          s = p.read_text(encoding='utf-8')
          old = "  if (!/NickClaim\\s*\\{[\\s\\S]{0,250}envelope:[\\s\\S]{0,500}verify_nick_lease/.test(source)) failures.push('GossipSub nickname claims do not share authenticated lease validation');"
          new = "  if (!source.includes('WireEvent::NickClaim') || !source.includes('verify_nick_lease(&lease, None, None, now_ms())')) failures.push('GossipSub nickname claims do not share authenticated lease validation');"
          if old not in s:
              raise SystemExit('staged checker patch anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format and verify
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          node scripts/test-nickname-lease-auth.mjs
          node scripts/check-nickname-lease-auth.mjs
          node scripts/test-progress-svg.mjs
          node scripts/progress-svg.mjs --check
          npm run audit
          git diff --check

      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Authenticate DHT nickname leases'
          git push origin HEAD:hardening/nickname-lease-auth-95
