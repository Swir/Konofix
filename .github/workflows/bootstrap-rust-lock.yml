name: Bootstrap Rust lockfile

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  commit-lockfile:
    if: github.repository == 'Swir/Konofix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Stop when Cargo.lock is already committed
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch src-tauri/Cargo.lock >/dev/null 2>&1; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'src-tauri/Cargo.lock is already committed; nothing to bootstrap.'
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Recover Cargo.lock from verified Windows CI artifact
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10456947058'
          EXPECTED_SHA256: '87a71764948925e938a1e2377e1d48b3f7641e9dba688b69b8073fb86bdbd02e'
        run: |
          set -euo pipefail
          mkdir -p /tmp/konofix-lock-artifact
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/konofix-lock-artifact.zip
          unzip -q /tmp/konofix-lock-artifact.zip -d /tmp/konofix-lock-artifact
          test -f /tmp/konofix-lock-artifact/artifact/Cargo.lock
          actual="$(sha256sum /tmp/konofix-lock-artifact/artifact/Cargo.lock | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          cp /tmp/konofix-lock-artifact/artifact/Cargo.lock src-tauri/Cargo.lock
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null
          git diff --check -- src-tauri/Cargo.lock

      - name: Commit verified Rust lockfile
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          git commit -m 'build: commit verified Rust lockfile'
          git push origin HEAD:main
