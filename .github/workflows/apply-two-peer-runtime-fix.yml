name: Apply two-peer runtime fix

on:
  push:
    branches: [ feature/global-beta-evidence-gate ]
    paths:
      - scripts/apply-two-peer-runtime-fix.py
      - .github/workflows/apply-two-peer-runtime-fix.yml

permissions:
  contents: write

concurrency:
  group: two-peer-runtime-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/global-beta-evidence-gate
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: x86_64-pc-windows-msvc
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply deterministic runtime fix
        shell: pwsh
        run: python scripts/apply-two-peer-runtime-fix.py

      - name: Format Rust
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Project and SVG audit
        shell: pwsh
        run: npm run audit

      - name: Frontend build
        shell: pwsh
        run: npm run build

      - name: Rust format gate
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust tests
        shell: pwsh
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust clippy
        shell: pwsh
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Commit verified fix to development branch
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { throw 'Runtime fix produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs CHANGELOG.md ROADMAP.md
          git commit -m 'Fix two-peer chat delivery and file acceptance runtime'
          git push origin HEAD:feature/global-beta-evidence-gate
