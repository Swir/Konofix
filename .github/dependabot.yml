version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
      frontend-major:
        update-types:
          - "major"

  # Keep the desktop and isolated headless Node manifests on one update surface.
  # The Linux Node CI parity gate requires shared production dependencies to
  # stay aligned, so Dependabot must update both manifests in the same run.
  - package-ecosystem: "cargo"
    directories:
      - "/src-tauri"
      - "/node-linux"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"
      rust-major:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      github-actions:
        patterns:
          - "*"
