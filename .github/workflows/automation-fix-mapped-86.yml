name: Finalize public-host mapped-IP policy

on:
  push:
    branches: [ automation/public-host-policy-86 ]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/public-host-policy-86
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy

      - name: Apply mapped-IP normalization
        run: python3 .automation/fix_public_host_mapped.py

      - name: Verify policy without polluting repository
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          npm ci
          npm run audit
          temp_target="$(mktemp -d)"
          cp src-tauri/Cargo.lock node-linux/Cargo.lock
          CARGO_TARGET_DIR="$temp_target" cargo test --manifest-path node-linux/Cargo.toml --locked --bin konofix-node
          rm -rf "$temp_target" node-linux/Cargo.lock
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          node scripts/check-public-host-policy.mjs
          node scripts/test-public-host-policy.mjs
          git diff --check

      - name: Commit verified follow-up
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/automation-fix-mapped-86.yml .automation/fix_public_host_mapped.py
          rmdir .automation 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize IPv4-mapped public hosts before multiaddr output"
          git push origin HEAD:automation/public-host-policy-86
