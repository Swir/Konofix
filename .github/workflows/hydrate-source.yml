name: Hydrate Konofix source

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/part_*'
      - '.github/workflows/hydrate-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover CRC-verified project files from ZIP local records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, binascii, struct, zlib, shutil

          bootstrap = Path('.bootstrap')
          pieces = []
          for i in range(8):
              p = bootstrap / f'part_{i:02d}'
              if not p.is_file():
                  raise SystemExit(f'Missing {p}')
              pieces.append(p.read_text(encoding='ascii').replace('\r','').replace('\n',''))

          joined = ''.join(pieces)
          first_pad = joined.find('=')
          usable_chars = (first_pad if first_pad >= 0 else len(joined))
          usable_chars -= usable_chars % 4
          raw = base64.b64decode(joined[:usable_chars], validate=True)

          out = Path('/tmp/konofix-source')
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)

          pos = 0
          recovered = []
          while pos + 4 <= len(raw):
              sig = raw[pos:pos+4]
              if sig in (b'PK\x01\x02', b'PK\x05\x06'):
                  break
              if sig != b'PK\x03\x04':
                  raise SystemExit(f'Unexpected ZIP signature at {pos}: {sig.hex()}')
              if pos + 30 > len(raw):
                  raise SystemExit(f'Truncated local header at {pos}')

              (_, _, flags, method, _, _, expected_crc,
               compressed_size, uncompressed_size, name_len, extra_len) = struct.unpack_from(
                  '<IHHHHHIIIHH', raw, pos
              )
              if flags & 0x08:
                  raise SystemExit('Unexpected ZIP data descriptor')

              name_start = pos + 30
              name_end = name_start + name_len
              data_start = name_end + extra_len
              data_end = data_start + compressed_size
              if data_end > len(raw):
                  raise SystemExit('Truncated ZIP payload')

              enc = 'utf-8' if flags & 0x800 else 'cp437'
              name = raw[name_start:name_end].decode(enc)
              compressed = raw[data_start:data_end]
              if method == 0:
                  data = compressed
              elif method == 8:
                  data = zlib.decompress(compressed, -15)
              else:
                  raise SystemExit(f'Unsupported compression {method}: {name}')

              if (binascii.crc32(data) & 0xffffffff) != expected_crc:
                  raise SystemExit(f'CRC mismatch: {name}')
              if len(data) != uncompressed_size:
                  raise SystemExit(f'Size mismatch: {name}')

              pure = PurePosixPath(name)
              if pure.is_absolute() or '..' in pure.parts:
                  raise SystemExit(f'Unsafe archive path: {name}')
              target = out.joinpath(*pure.parts)
              if name.endswith('/'):
                  target.mkdir(parents=True, exist_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              recovered.append(name)
              pos = data_end

          required = {
              'README.md','ROADMAP.md','CHANGELOG.md','package.json',
              'src/main.ts','src/style.css','src-tauri/Cargo.toml',
              'src-tauri/src/lib.rs','src-tauri/src/main.rs',
              'src-tauri/src/bin/konofix-node.rs',
              '.github/workflows/windows-ci.yml',
          }
          missing = sorted(required - set(recovered))
          if missing:
              raise SystemExit('Missing recovered files: ' + ', '.join(missing))
          if len(recovered) < 20:
              raise SystemExit(f'Incomplete recovery: {len(recovered)} entries')
          print(f'Recovered and CRC-verified {len(recovered)} ZIP entries')
          PY

      - name: Stage normal project source without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.github/' /tmp/konofix-source/ ./
          cp /tmp/konofix-source/.github/workflows/windows-ci.yml ./WINDOWS_CI_BOOTSTRAP.yml

      - name: Commit recovered Konofix Chat source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md CHANGELOG.md package.json src-tauri src docs scripts index.html .gitignore run-dev.bat build-node.bat run-node.bat build-windows.bat WINDOWS_CI_BOOTSTRAP.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Import recovered Konofix Chat 0.4.1 source"
          git push origin HEAD:main
