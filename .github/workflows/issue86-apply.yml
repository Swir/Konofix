name: Issue 86 hardening integration

on:
  push:
    branches:
      - codex/issue-86-public-host-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply issue 86 hardening
        run: |
          python3 .github/issue86_apply.py
          python3 .github/issue86_policy_fix.py

      - name: Remove temporary integration helpers before policy audit
        run: git rm .github/workflows/issue86-apply.yml .github/issue86_apply.py .github/issue86_policy_fix.py

      - name: Format and verify
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          node scripts/test-public-host-policy.mjs
          node scripts/check-public-host-policy.mjs
          npm ci
          npm run audit
          cargo test --manifest-path src-tauri/Cargo.toml --bin konofix-node --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --bin konofix-node --locked -- -D warnings
          git diff HEAD --check

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden raw public-host validation"
          git push origin HEAD:codex/issue-86-public-host-hardening
