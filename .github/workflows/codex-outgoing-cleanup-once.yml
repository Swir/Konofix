name: One-shot outgoing disconnect cleanup patch

on:
  push:
    branches:
      - codex/outgoing-disconnect-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped lib.rs patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src-tauri/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          connection = 'SwarmEvent::ConnectionClosed { peer_id: remote, num_established, .. } => {'
          status = 'emit_status(&app, &mut swarm, bootstrap_count, &nat_status, &listen_addresses, "Połączenie z peerem zamknięte");'
          outgoing_marker = 'let outgoing_from_peer: Vec<String> = outgoing'

          if outgoing_marker in text:
              raise SystemExit('Outgoing disconnect cleanup already exists; refusing to apply twice.')

          start = text.find(connection)
          if start < 0:
              raise SystemExit('ConnectionClosed handler not found.')
          status_at = text.find(status, start)
          if status_at < 0:
              raise SystemExit('ConnectionClosed status marker not found.')
          close_at = text.rfind('\n                    }', start, status_at)
          if close_at < 0:
              raise SystemExit('Final num_established guard close not found.')

          insertion = '''

                          let outgoing_from_peer: Vec<String> = outgoing
                              .iter()
                              .filter(|(_, candidate)| candidate.peer == remote)
                              .map(|(id, _)| id.clone())
                              .collect();
                          outbound_requests.retain(|_, meta| !outgoing_from_peer.contains(&meta.transfer_id));
                          for transfer_id in outgoing_from_peer {
                              if let Some(transfer) = outgoing.remove(&transfer_id) {
                                  emit_transfer(
                                      &app,
                                      &file_view_outgoing(
                                          &transfer_id,
                                          &transfer,
                                          "failed",
                                          None,
                                          Some("Peer disconnected before the outgoing file transfer completed.".into()),
                                      ),
                                  );
                              }
                          }
          '''
          path.write_text(text[:close_at] + insertion + text[close_at:], encoding="utf-8")

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify file-transfer liveness policy
        run: |
          node scripts/test-file-transfer-liveness.mjs
          node scripts/check-file-transfer-liveness.mjs

      - name: Commit scoped implementation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/codex-outgoing-cleanup-once.yml
          git add src-tauri/src/lib.rs
          git diff --cached --check
          git commit -m "Reclaim outgoing transfers on final peer disconnect"
          git push origin HEAD:codex/outgoing-disconnect-cleanup
