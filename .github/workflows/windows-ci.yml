name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Release metadata gate
        shell: pwsh
        run: .\scripts\release-gate.ps1

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript + Vite build
        run: npm run build

      - name: Cargo check - Konofix Chat
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo check - Konofix Node
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin konofix-node

      - name: Build production Windows app
        if: github.event_name == 'push'
        run: npm run tauri build

      - name: Build production Konofix Node
        if: github.event_name == 'push'
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin konofix-node

      - name: Stage Windows test bundle
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item 'src-tauri\target\release\konofix-node.exe' 'artifact\konofix-node.exe'
          if (Test-Path 'src-tauri\target\release\bundle') {
            Copy-Item 'src-tauri\target\release\bundle' 'artifact\bundle' -Recurse -Force
          }
          Copy-Item 'README.md' 'artifact\README.md'
          Copy-Item 'docs\TESTING.md' 'artifact\TESTING.md'
          Copy-Item 'docs\NODE.md' 'artifact\NODE.md'
          Copy-Item 'docs\RELEASE_0.4.2_TEST1.md' 'artifact\RELEASE_NOTES.md'
          if (Test-Path 'package-lock.json') {
            Copy-Item 'package-lock.json' 'artifact\package-lock.json'
          }
          if (Test-Path 'src-tauri\Cargo.lock') {
            Copy-Item 'src-tauri\Cargo.lock' 'artifact\Cargo.lock'
          }
          Get-ChildItem artifact -Recurse | Select-Object FullName, Length

      - name: Create release ZIP and checksum
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'Konofix-Chat-0.4.2-test1-Windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'artifact\*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Verify release artifact integrity
        if: github.event_name == 'push'
        shell: pwsh
        run: .\scripts\verify-release.ps1

      - name: Upload Windows test bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Konofix-Chat-0.4.2-Windows-${{ github.sha }}
          path: |
            artifact
            Konofix-Chat-0.4.2-test1-Windows.zip
            Konofix-Chat-0.4.2-test1-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish first cross-country test pre-release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.4.2-test1'
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag już istnieje — pomijam ponowną publikację."
            exit 0
          }
          gh release create $tag `
            'Konofix-Chat-0.4.2-test1-Windows.zip' `
            'Konofix-Chat-0.4.2-test1-Windows.zip.sha256' `
            'artifact\konofix-node.exe' `
            --repo $repo `
            --target $env:GITHUB_SHA `
            --title 'Konofix Chat 0.4.2 Test 1 — Cross-country P2P Preview' `
            --notes-file 'docs\RELEASE_0.4.2_TEST1.md' `
            --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
