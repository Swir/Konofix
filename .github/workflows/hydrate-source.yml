name: Hydrate Konofix source

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/part_*'
      - '.github/workflows/hydrate-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and repair Konofix Chat 0.4.1 archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import io
          import zipfile

          root = Path('.bootstrap')
          parts = [root / f'part_{i:02d}' for i in range(8)]
          for p in parts:
              if not p.is_file():
                  raise SystemExit(f'Missing bootstrap part: {p}')

          text = [p.read_text(encoding='ascii').replace('\r', '').replace('\n', '') for p in parts]

          # The original bootstrap was transported in three Base64 segments:
          # 1) 56,000 chars, 2) a 2,576-char segment with one lost char,
          # 3) part_07. Recover only the single lost Base64 character and accept
          # a candidate exclusively when the resulting ZIP passes full integrity checks.
          head_b64 = ''.join(text[:6]) + text[6][:8000]
          middle_broken = text[6][8000:]
          tail_b64 = text[7]

          print(f'head={len(head_b64)} middle_broken={len(middle_broken)} tail={len(tail_b64)}')
          if len(head_b64) != 56000:
              raise SystemExit(f'Unexpected head length: {len(head_b64)}')
          if len(middle_broken) != 2575:
              raise SystemExit(f'Unexpected middle length: {len(middle_broken)}')
          if len(tail_b64) != 2584:
              raise SystemExit(f'Unexpected tail length: {len(tail_b64)}')
          if not middle_broken.endswith('g=='):
              raise SystemExit('Unexpected middle trailer; refusing heuristic repair')

          head = base64.b64decode(head_b64, validate=True)
          tail = base64.b64decode(tail_b64, validate=True)
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          required = {
              'src-tauri/Cargo.toml',
              'src-tauri/src/lib.rs',
              'src/main.ts',
              'ROADMAP.md',
              'README.md',
          }
          successes = []

          # One Base64 character vanished immediately before the final 3 chars
          # of the middle segment. Brute-force all 64 legal symbols and verify ZIP.
          insert_at = len(middle_broken) - 3
          for ch in alphabet:
              candidate_b64 = middle_broken[:insert_at] + ch + middle_broken[insert_at:]
              try:
                  middle = base64.b64decode(candidate_b64, validate=True)
              except Exception:
                  continue
              blob = head + middle + tail
              try:
                  with zipfile.ZipFile(io.BytesIO(blob), 'r') as zf:
                      names = set(zf.namelist())
                      if not required.issubset(names):
                          continue
                      if zf.testzip() is not None:
                          continue
              except Exception:
                  continue
              successes.append((ch, blob))

          if len(successes) != 1:
              raise SystemExit(f'Expected exactly one valid repair, got {len(successes)}')

          repaired_char, blob = successes[0]
          Path('/tmp/konofix-source.zip').write_bytes(blob)
          (root / 'repair-result.txt').write_text(
              f'Konofix Chat bootstrap repaired deterministically.\n'
              f'Inserted Base64 character: {repaired_char}\n'
              f'Archive bytes: {len(blob)}\n',
              encoding='utf-8',
          )
          print(f'Repaired with Base64 character {repaired_char!r}; archive bytes={len(blob)}')
          PY

          unzip -t /tmp/konofix-source.zip
          rm -rf /tmp/konofix-source
          mkdir -p /tmp/konofix-source
          unzip -q /tmp/konofix-source.zip -d /tmp/konofix-source
          test -f /tmp/konofix-source/src-tauri/Cargo.toml
          test -f /tmp/konofix-source/src/main.ts
          test -f /tmp/konofix-source/ROADMAP.md

      - name: Replace bootstrap files with project source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          for item in /tmp/konofix-source/*; do
            cp -a "$item" ./
          done
          rm -rf .bootstrap
          rm -f .github/workflows/hydrate-source.yml

      - name: Commit hydrated project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Import full Konofix Chat 0.4.1 source"
          git push origin HEAD:main
