name: Issue 95 integration

on:
  push:
    branches:
      - 'hardening/nickname-lease-auth-95'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply hardening
        run: python scripts/issue95-apply.py

      - name: Format and verify
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          node scripts/test-nickname-lease-auth.mjs
          node scripts/check-nickname-lease-auth.mjs
          node scripts/test-progress-svg.mjs
          node scripts/progress-svg.mjs --check
          npm run audit
          git diff --check

      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Authenticate DHT nickname leases'
          git push origin HEAD:hardening/nickname-lease-auth-95
