name: Apply cancellation convergence patch

on:
  push:
    branches:
      - codex/cancel-state-convergence

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run cancellation convergence patch v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply focused source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          lib = 'src-tauri/src/lib.rs'
          replace_once(lib, '                        let result = if let Some(transfer) = outgoing.remove(&transfer_id) {\n                            let request_id = swarm.behaviour_mut().file_transfer.send_request(', '                        let result = if let Some(transfer) = outgoing.remove(&transfer_id) {\n                            outbound_requests.retain(|_, meta| meta.transfer_id != transfer_id);\n                            let request_id = swarm.behaviour_mut().file_transfer.send_request(')
          replace_once(lib, '                                            if pending_matches { pending_incoming.remove(&transfer_id); }', '                                            if pending_matches {\n                                                pending_incoming.remove(&transfer_id);\n                                                let _ = app.emit(\n                                                    "file-offer-cancelled",\n                                                    serde_json::json!({\n                                                        "transfer_id": transfer_id.clone(),\n                                                        "peer_id": peer.to_string(),\n                                                    }),\n                                                );\n                                            }')
          replace_once(lib, '                                            if outgoing_matches {\n                                                if let Some(transfer) = outgoing.remove(&transfer_id) {', '                                            if outgoing_matches {\n                                                outbound_requests.retain(|_, meta| meta.transfer_id != transfer_id);\n                                                if let Some(transfer) = outgoing.remove(&transfer_id) {')

          main = 'src/main.ts'
          replace_once(main, 'type FileOfferExpired = { transfer_id: string; peer_id: string };', 'type FileOfferExpired = { transfer_id: string; peer_id: string };\ntype FileOfferCancelled = { transfer_id: string; peer_id: string };')
          expired = "  await listen<FileOfferExpired>('file-offer-expired', event => {\n    const modal = document.querySelector(`#file-offer-${CSS.escape(event.payload.transfer_id)}`);\n    if (!modal) return;\n    modal.remove();\n    if (state.connected) addSystem(state.room, t('transfer.offerExpired'));\n  });"
          cancelled = "  await listen<FileOfferCancelled>('file-offer-cancelled', event => {\n    const modal = document.querySelector(`#file-offer-${CSS.escape(event.payload.transfer_id)}`);\n    if (!modal) return;\n    modal.remove();\n    if (state.connected) addSystem(state.room, t('transfer.offerCancelled'));\n  });"
          replace_once(main, expired, expired + '\n' + cancelled)

          i18n = 'src/i18n.ts'
          replace_once(i18n, "  'transfer.offerExpired': '⌛ Incoming file offer expired before it was accepted.',\n", "  'transfer.offerExpired': '⌛ Incoming file offer expired before it was accepted.',\n  'transfer.offerCancelled': '🚫 Incoming file offer was cancelled by the sender.',\n")
          replace_once(i18n, "  'transfer.offerExpired': '⌛ Oferta przychodzącego pliku wygasła przed akceptacją.',\n", "  'transfer.offerExpired': '⌛ Oferta przychodzącego pliku wygasła przed akceptacją.',\n  'transfer.offerCancelled': '🚫 Nadawca anulował ofertę przychodzącego pliku.',\n")
          replace_once(i18n, "  'transfer.reject': 'Avvis', 'transfer.accept': 'Godta',\n", "  'transfer.reject': 'Avvis', 'transfer.accept': 'Godta',\n  'transfer.offerCancelled': '🚫 Avsenderen avbrøt det innkommende filtilbudet.',\n")
          replace_once(i18n, "  'transfer.failed': 'Fehler', 'transfer.completed': 'Fertig', 'common.cancel': 'Abbrechen',\n", "  'transfer.failed': 'Fehler', 'transfer.completed': 'Fertig', 'common.cancel': 'Abbrechen',\n  'transfer.offerCancelled': '🚫 Der Absender hat das eingehende Dateiangebot abgebrochen.',\n")
          replace_once(i18n, "  'transfer.failed': 'Erreur', 'transfer.completed': 'Terminé', 'common.cancel': 'Annuler',\n", "  'transfer.failed': 'Erreur', 'transfer.completed': 'Terminé', 'common.cancel': 'Annuler',\n  'transfer.offerCancelled': '🚫 L’expéditeur a annulé l’offre de fichier entrante.',\n")
          replace_once(i18n, "  'transfer.failed': 'Error', 'transfer.completed': 'Completado', 'common.cancel': 'Cancelar',\n", "  'transfer.failed': 'Error', 'transfer.completed': 'Completado', 'common.cancel': 'Cancelar',\n  'transfer.offerCancelled': '🚫 El remitente canceló la oferta de archivo entrante.',\n")
          replace_once(i18n, "  'transfer.failed': 'Помилка', 'transfer.completed': 'Готово', 'common.cancel': 'Скасувати',\n", "  'transfer.failed': 'Помилка', 'transfer.completed': 'Готово', 'common.cancel': 'Скасувати',\n  'transfer.offerCancelled': '🚫 Відправник скасував пропозицію вхідного файлу.',\n")

          changelog = 'CHANGELOG.md'
          replace_once(changelog, '## 0.4.2\n\n', '## 0.4.2\n\n- converged explicit file-transfer cancellation across backend request bookkeeping and receiver UX: local outgoing cancel now prunes only stale same-transfer Offer/Chunk/Complete metadata before tracking the Cancel handshake, authenticated remote cancel applies the same scoped pruning, and sender-cancelled unanswered offers emit a transfer-specific UI event with dedicated messages in all seven supported locales; focused adversarial policy tests guard peer ownership, unrelated metadata, modal targeting and the independent TTL-expiry path without changing Real Internet Test credit,\n')

          roadmap = 'ROADMAP.md'
          anchor = "- Accepted incoming file transfers now have a 120-second inactivity lease that advances only after a successfully written non-empty chunk; abandoned senders can no longer retain all receive slots indefinitely, zero-byte keepalive chunks are rejected, and the final connection close for a remote Peer ID immediately clears that peer's unanswered offers and accepted receive state while deleting only transfer-owned `.konofixpart` files. TTL-boundary regression coverage is included and the Real Internet Test milestone stays 54/59.\n"
          note = "- Explicit file-transfer cancellation now converges both backend bookkeeping and receiver UI: stale same-transfer outbound request metadata is pruned without touching unrelated transfers, the new Cancel handshake remains tracked, and an authenticated sender cancelling an unanswered offer closes only that transfer's modal with a dedicated localized message while the TTL-expiry path remains independent. Focused adversarial policy coverage guards these invariants; this resilience/UX hardening does not add Real Internet Test credit and the milestone remains 54/59.\n"
          replace_once(roadmap, anchor, anchor + note)

          Path('.github/workflows/apply-cancel-convergence.yml').unlink()
          PY
      - name: Format Rust source
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Install frontend dependencies
        run: npm ci
      - name: Run project and adversarial audits
        run: npm run audit
      - name: Build TypeScript and Vite frontend
        run: npm run build
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Converge file-transfer cancellation state"
          git push origin HEAD:codex/cancel-state-convergence
