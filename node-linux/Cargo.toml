[package]
name = "konofix-chat"
version = "0.4.2"
description = "Ephemeral global peer-to-peer chat for Windows"
authors = ["Swir"]
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "konofix-node"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
slug = "0.1"
unicode-normalization = "0.1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
libp2p = { version = "0.57", features = [
  "tokio",
  "tcp",
  "quic",
  "dns",
  "noise",
  "yamux",
  "gossipsub",
  "mdns",
  "kad",
  "identify",
  "ping",
  "autonat",
  "relay",
  "dcutr",
  "upnp",
  "request-response",
  "cbor",
  "macros"
] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = [] }
rfd = "0.17.2"
