name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript + Vite build
        run: npm run build

      - name: Cargo check - Konofix Chat
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo check - Konofix Node
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin konofix-node
