name: Clean nickname trust hardening 95

on:
  push:
    branches:
      - hardening/dht-nickname-hints-95-clean

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/dht-nickname-hints-95-clean
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply patch
        shell: bash
        run: python3 scripts/stage-nickname-hardening-95.py

      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          node scripts/test-nickname-lease-trust.mjs
          node scripts/check-nickname-lease-trust.mjs
          npm ci
          npm run audit
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check
          stats="$(git diff --numstat -- src-tauri/src/lib.rs)"
          if [ -n "$stats" ]; then
            total="$(printf '%s\n' "$stats" | awk '{sum += $1 + $2} END {print sum + 0}')"
            if [ "$total" -gt 220 ]; then
              echo "lib.rs diff unexpectedly large: $stats" >&2
              exit 1
            fi
          fi

      - name: Commit verified patch and retire staging helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-nickname-hardening-95-clean.yml
          rm scripts/stage-nickname-hardening-95.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden DHT nickname lease trust boundary"
          git push origin HEAD:hardening/dht-nickname-hints-95-clean
