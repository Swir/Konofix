version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      # Low-risk maintenance can share one review/build cycle. Major upgrades
      # stay ungrouped so a toolchain break has one dependency-sized blast radius.
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep the desktop and isolated headless Node manifests on one update surface.
  # The Linux Node CI parity gate requires shared production dependencies to
  # stay aligned, so Dependabot must update both manifests in the same run.
  - package-ecosystem: "cargo"
    directories:
      - "/src-tauri"
      - "/node-linux"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      # Keep routine Rust maintenance compact, but isolate major upgrades.
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      # Major Action runtime changes (for example Node runtime jumps) are
      # intentionally reviewed one at a time just like application toolchains.
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
