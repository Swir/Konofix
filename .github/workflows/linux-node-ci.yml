name: Linux Node CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: linux-node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt

      - name: Locked Rust metadata
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Headless dependency gate
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu --edges normal,build > node-linux-deps.txt
          if grep -E '(^|[[:space:]])(tauri|tauri-build|rfd) v' node-linux-deps.txt; then
            echo 'Linux Node dependency graph unexpectedly contains desktop GUI dependencies.' >&2
            grep -E '(^|[[:space:]])(tauri|tauri-build|rfd) v' node-linux-deps.txt >&2 || true
            exit 1
          fi

      - name: Konofix Node tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin konofix-node

      - name: Build release Linux Node
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release --bin konofix-node

      - name: Linux Node smoke test
        shell: bash
        run: |
          set -euo pipefail
          node='src-tauri/target/release/konofix-node'
          test -x "$node"
          "$node" --help | grep -F 'Konofix Node 0.4.2'
          "$node" --help | grep -F -- '--identity-file'
          "$node" --help | grep -F -- '--health-file'

      - name: Linux systemd installer self-tests
        shell: bash
        run: bash scripts/test-public-node-linux.sh

      - name: Stage Linux Node bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-linux/scripts artifact-linux/docs
          install -m 0755 src-tauri/target/release/konofix-node artifact-linux/konofix-node
          install -m 0755 scripts/install-public-node-linux.sh artifact-linux/scripts/install-public-node-linux.sh
          cp docs/NODE.md artifact-linux/docs/NODE.md
          cp docs/NODE_SOAK.md artifact-linux/docs/NODE_SOAK.md
          version="$(node -p "require('./package.json').version")"
          bytes="$(stat -c '%s' artifact-linux/konofix-node)"
          sha256="$(sha256sum artifact-linux/konofix-node | awk '{print $1}')"
          cat > artifact-linux/NODE_BUILD_INFO.json <<EOF
          {
            "schema": 1,
            "product": "Konofix Node",
            "platform": "linux-x86_64",
            "version": "$version",
            "commit": "${GITHUB_SHA}",
            "node": {
              "path": "konofix-node",
              "bytes": $bytes,
              "sha256": "$sha256"
            }
          }
          EOF
          tar -C artifact-linux -czf Konofix-Node-0.4.2-Linux-x86_64.tar.gz .
          sha256sum Konofix-Node-0.4.2-Linux-x86_64.tar.gz > Konofix-Node-0.4.2-Linux-x86_64.tar.gz.sha256

      - name: Verify Linux Node bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf Konofix-Node-0.4.2-Linux-x86_64.tar.gz | grep -F './konofix-node'
          tar -tzf Konofix-Node-0.4.2-Linux-x86_64.tar.gz | grep -F './scripts/install-public-node-linux.sh'
          tar -tzf Konofix-Node-0.4.2-Linux-x86_64.tar.gz | grep -F './NODE_BUILD_INFO.json'
          sha256sum -c Konofix-Node-0.4.2-Linux-x86_64.tar.gz.sha256

      - name: Upload Linux Node bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Konofix-Node-0.4.2-Linux-x86_64-${{ github.sha }}
          path: |
            artifact-linux
            Konofix-Node-0.4.2-Linux-x86_64.tar.gz
            Konofix-Node-0.4.2-Linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
