name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: x86_64-pc-windows-msvc
          toolchain: stable

      - name: Release metadata gate
        shell: pwsh
        run: .\scripts\release-gate.ps1

      - name: Network evidence gate self-tests
        shell: pwsh
        run: .\scripts\test-network-evidence-gate.ps1

      - name: Node health validator self-tests
        shell: pwsh
        run: .\scripts\test-node-health.ps1

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Project consistency and localization audit
        run: npm run audit

      - name: TypeScript + Vite build
        run: npm run build

      - name: Cargo check - Konofix Chat
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo check - Konofix Node
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin konofix-node

      - name: Build production Windows app
        if: github.event_name == 'push'
        run: npm run tauri build

      - name: Build production Konofix Node
        if: github.event_name == 'push'
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin konofix-node

      - name: Stage Windows test bundle
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item 'src-tauri\target\release\konofix-node.exe' 'artifact\konofix-node.exe'
          if (Test-Path 'src-tauri\target\release\bundle') { Copy-Item 'src-tauri\target\release\bundle' 'artifact\bundle' -Recurse -Force }
          Copy-Item 'README.md' 'artifact\README.md'
          Copy-Item 'docs\TESTING.md' 'artifact\TESTING.md'
          Copy-Item 'docs\NODE.md' 'artifact\NODE.md'
          Copy-Item 'docs\RELEASE_0.4.2_TEST1.md' 'artifact\RELEASE_NOTES.md'
          if (Test-Path 'package-lock.json') { Copy-Item 'package-lock.json' 'artifact\package-lock.json' }
          if (Test-Path 'src-tauri\Cargo.lock') { Copy-Item 'src-tauri\Cargo.lock' 'artifact\Cargo.lock' }
          Get-ChildItem artifact -Recurse | Select-Object FullName, Length

      - name: Create release ZIP and checksum
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'Konofix-Chat-0.4.2-test1-Windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'artifact\*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Verify release artifact integrity
        if: github.event_name == 'push'
        shell: pwsh
        run: .\scripts\verify-release.ps1

      - name: Upload Windows test bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Konofix-Chat-0.4.2-Windows-${{ github.sha }}
          path: |
            artifact
            Konofix-Chat-0.4.2-test1-Windows.zip
            Konofix-Chat-0.4.2-test1-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 14
