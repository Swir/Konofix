name: One-time P2P identity hardening v2

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  harden:
    if: github.repository == 'Swir/Konofix'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: x86_64-pc-windows-msvc
          toolchain: stable
          components: rustfmt

      - name: Apply fail-closed authenticated-peer binding
        id: patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import re

          path = Path('src-tauri/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          marker = 'fn wire_event_matches_source(event: &WireEvent, source: &PeerId) -> bool'
          if marker in text:
              Path('security-patch-needed.txt').write_text('false', encoding='utf-8')
              print('Security hardening already present; no source mutation required.')
              raise SystemExit(0)

          def replace_once(pattern, replacement, label, flags=0):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'Could not patch {label}; matches={count}')

          insertion = '''fn wire_event_claimed_peer_id(event: &WireEvent) -> Option<&str> {
              match event {
                  WireEvent::Presence { peer_id, .. }
                  | WireEvent::Goodbye { peer_id }
                  | WireEvent::NickClaim { peer_id, .. } => Some(peer_id.as_str()),
                  WireEvent::Chat(message) => message.peer_id.as_deref(),
                  WireEvent::RoomCreate(room) => room.owner.as_deref(),
                  WireEvent::RoomClose { owner, .. } => Some(owner.as_str()),
              }
          }

          fn wire_event_matches_source(event: &WireEvent, source: &PeerId) -> bool {
              let source = source.to_string();
              wire_event_claimed_peer_id(event)
                  .map(|claimed| claimed == source.as_str())
                  .unwrap_or(false)
          }

          #[derive(Debug, Clone, Serialize, Deserialize)]
          #[serde(tag = "type", rename_all = "snake_case")]
          enum FileRequest {'''
          replace_once(
              r'#\[derive\(Debug, Clone, Serialize, Deserialize\)\]\n#\[serde\(tag = "type", rename_all = "snake_case"\)\]\nenum FileRequest \{',
              lambda _: insertion,
              'WireEvent identity helper insertion',
          )

          gossip_pattern = re.compile(
              r'(?P<base>\s*)SwarmEvent::Behaviour\(BehaviourEvent::Gossipsub\(gossipsub::Event::Message \{ message, \.\. \}\)\) => \{\n'
              r'(?P<body>\s*)if let Ok\(event\) = serde_json::from_slice::<WireEvent>\(&message\.data\) \{\n'
              r'(?P<match>\s*)match event \{'
          )
          match = gossip_pattern.search(text)
          if not match:
              raise RuntimeError('Could not patch GossipSub message handler')
          body = match.group('body')
          match_indent = match.group('match')
          replacement = (
              f"{match.group('base')}SwarmEvent::Behaviour(BehaviourEvent::Gossipsub(gossipsub::Event::Message {{ message, .. }})) => {{\n"
              f"{body}let Some(authenticated_source) = message.source.as_ref() else {{\n"
              f"{match_indent}let _ = app.emit(\"network-warning\", \"Dropped P2P event without an authenticated source Peer ID.\");\n"
              f"{match_indent}continue;\n"
              f"{body}}};\n"
              f"{body}if let Ok(event) = serde_json::from_slice::<WireEvent>(&message.data) {{\n"
              f"{match_indent}if !wire_event_matches_source(&event, authenticated_source) {{\n"
              f"{match_indent}    let _ = app.emit(\n"
              f"{match_indent}        \"network-warning\",\n"
              f"{match_indent}        format!(\"Dropped P2P event with forged payload identity from {{authenticated_source}}.\"),\n"
              f"{match_indent}    );\n"
              f"{match_indent}    continue;\n"
              f"{match_indent}}}\n"
              f"{match_indent}match event {{"
          )
          text = text[:match.start()] + replacement + text[match.end():]

          offer_pattern = re.compile(
              r'(?P<i>\s*)FileRequest::Offer \{ transfer_id, file_name, size \} => \{\n'
              r'(?P<b>\s*)if size > MAX_FILE_SIZE \{'
          )
          match = offer_pattern.search(text)
          if not match:
              raise RuntimeError('Could not patch incoming offer handler')
          i, b = match.group('i'), match.group('b')
          replacement = (
              f"{i}FileRequest::Offer {{ transfer_id, file_name, size }} => {{\n"
              f"{b}if Uuid::parse_str(&transfer_id).is_err() {{\n"
              f"{b}    let _ = swarm.behaviour_mut().file_transfer.send_response(channel, FileResponse::Rejected {{ reason: \"Invalid transfer ID.\".into() }});\n"
              f"{b}    continue;\n"
              f"{b}}}\n"
              f"{b}if pending_incoming.contains_key(&transfer_id)\n"
              f"{b}    || incoming.contains_key(&transfer_id)\n"
              f"{b}    || outgoing.contains_key(&transfer_id)\n"
              f"{b}{{\n"
              f"{b}    let _ = swarm.behaviour_mut().file_transfer.send_response(channel, FileResponse::Rejected {{ reason: \"Transfer ID is already active.\".into() }});\n"
              f"{b}    continue;\n"
              f"{b}}}\n"
              f"{b}if size > MAX_FILE_SIZE {{"
          )
          text = text[:match.start()] + replacement + text[match.end():]

          complete_pattern = re.compile(
              r'(?P<i>\s*)FileRequest::Complete \{ transfer_id, sha256 \} => \{\n'
              r'(?P<b>\s*)let response = if let Some\(mut transfer\) = incoming\.remove\(&transfer_id\) \{'
          )
          match = complete_pattern.search(text)
          if not match:
              raise RuntimeError('Could not patch incoming completion handler')
          i, b = match.group('i'), match.group('b')
          replacement = (
              f"{i}FileRequest::Complete {{ transfer_id, sha256 }} => {{\n"
              f"{b}let sender_mismatch = incoming\n"
              f"{b}    .get(&transfer_id)\n"
              f"{b}    .map(|transfer| transfer.peer != peer)\n"
              f"{b}    .unwrap_or(false);\n"
              f"{b}let hash_format_valid = sha256.len() == 64 && sha256.bytes().all(|byte| byte.is_ascii_hexdigit());\n"
              f"{b}let response = if sender_mismatch {{\n"
              f"{b}    FileResponse::Error {{ message: \"Transfer sender identity mismatch.\".into() }}\n"
              f"{b}}} else if !hash_format_valid {{\n"
              f"{b}    FileResponse::Error {{ message: \"Invalid SHA-256 digest format.\".into() }}\n"
              f"{b}}} else if let Some(mut transfer) = incoming.remove(&transfer_id) {{"
          )
          text = text[:match.start()] + replacement + text[match.end():]

          cancel_pattern = re.compile(
              r'(?P<i>\s*)FileRequest::Cancel \{ transfer_id \} => \{\n'
              r'(?P<body>.*?)'
              r'(?P<b>\s*)let _ = swarm\.behaviour_mut\(\)\.file_transfer\.send_response\(channel, FileResponse::Ack \{ received: 0 \}\);\n'
              r'(?P=i)\}',
              re.DOTALL,
          )
          match = cancel_pattern.search(text)
          if not match:
              raise RuntimeError('Could not patch inbound cancel handler')
          i = match.group('i')
          b = match.group('b')
          replacement = (
              f"{i}FileRequest::Cancel {{ transfer_id }} => {{\n"
              f"{b}let pending_matches = pending_incoming.get(&transfer_id).map(|transfer| transfer.peer == peer).unwrap_or(false);\n"
              f"{b}let incoming_matches = incoming.get(&transfer_id).map(|transfer| transfer.peer == peer).unwrap_or(false);\n"
              f"{b}let outgoing_matches = outgoing.get(&transfer_id).map(|transfer| transfer.peer == peer).unwrap_or(false);\n"
              f"{b}let matched = pending_matches || incoming_matches || outgoing_matches;\n"
              f"{b}if pending_matches {{ pending_incoming.remove(&transfer_id); }}\n"
              f"{b}if incoming_matches {{\n"
              f"{b}    if let Some(transfer) = incoming.remove(&transfer_id) {{\n"
              f"{b}        let _ = tokio::fs::remove_file(&transfer.temp_path).await;\n"
              f"{b}        emit_transfer(&app, &file_view_incoming(&transfer_id, &transfer, \"cancelled\", None, Some(\"Druga strona anulowała transfer.\".into())));\n"
              f"{b}    }}\n"
              f"{b}}}\n"
              f"{b}if outgoing_matches {{\n"
              f"{b}    if let Some(transfer) = outgoing.remove(&transfer_id) {{\n"
              f"{b}        emit_transfer(&app, &file_view_outgoing(&transfer_id, &transfer, \"cancelled\", None, Some(\"Druga strona anulowała transfer.\".into())));\n"
              f"{b}    }}\n"
              f"{b}}}\n"
              f"{b}let response = if matched {{\n"
              f"{b}    FileResponse::Ack {{ received: 0 }}\n"
              f"{b}}} else {{\n"
              f"{b}    FileResponse::Error {{ message: \"Transfer not found for requesting peer.\".into() }}\n"
              f"{b}}};\n"
              f"{b}let _ = swarm.behaviour_mut().file_transfer.send_response(channel, response);\n"
              f"{i}}}"
          )
          text = text[:match.start()] + replacement + text[match.end():]

          tests = '''#[cfg(test)]
          mod authenticated_event_tests {
              use super::*;

              fn test_peer() -> PeerId {
                  libp2p::identity::Keypair::generate_ed25519().public().to_peer_id()
              }

              #[test]
              fn wire_event_payload_identity_must_match_authenticated_source() {
                  let source = test_peer();
                  let attacker = test_peer();
                  let source_text = source.to_string();
                  let events = vec![
                      WireEvent::Presence { peer_id: source_text.clone(), nick: "alice".into() },
                      WireEvent::Goodbye { peer_id: source_text.clone() },
                      WireEvent::NickClaim { peer_id: source_text.clone(), nick: "alice".into(), canonical: "alice".into(), expires_at: 1 },
                      WireEvent::Chat(ChatMessage { id: "message".into(), kind: "chat".into(), peer_id: Some(source_text.clone()), nick: "alice".into(), room: "world".into(), text: "hello".into(), timestamp: 1 }),
                      WireEvent::RoomCreate(RoomInfo { id: "room".into(), title: "# room".into(), owner: Some(source_text.clone()), users: Some(1) }),
                      WireEvent::RoomClose { room_id: "room".into(), owner: source_text.clone() },
                  ];
                  for event in events {
                      assert!(wire_event_matches_source(&event, &source));
                      assert!(!wire_event_matches_source(&event, &attacker));
                  }
                  let missing_chat_identity = WireEvent::Chat(ChatMessage { id: "message".into(), kind: "chat".into(), peer_id: None, nick: "alice".into(), room: "world".into(), text: "hello".into(), timestamp: 1 });
                  assert!(!wire_event_matches_source(&missing_chat_identity, &source));
                  let missing_room_owner = WireEvent::RoomCreate(RoomInfo { id: "room".into(), title: "# room".into(), owner: None, users: Some(1) });
                  assert!(!wire_event_matches_source(&missing_room_owner, &source));
              }
          }

          pub fn run() {'''
          replace_once(r'pub fn run\(\) \{', lambda _: tests, 'security regression tests')

          path.write_text(text, encoding='utf-8')
          Path('security-patch-needed.txt').write_text('true', encoding='utf-8')
          print('Applied authenticated GossipSub identity and file-transfer sender hardening.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Security patch script failed with exit code $LASTEXITCODE." }
          if ((Get-Content security-patch-needed.txt -Raw).Trim() -eq 'true') {
            "needed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "needed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Format Rust source
        if: steps.patch.outputs.needed == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Verify locked Rust tests
        if: steps.patch.outputs.needed == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Verify no formatting diff errors
        if: steps.patch.outputs.needed == 'true'
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed with exit code $LASTEXITCODE." }

      - name: Commit verified security hardening
        if: steps.patch.outputs.needed == 'true'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs
          git commit -m 'security: bind P2P payloads to authenticated peers'
          git push origin HEAD:main
