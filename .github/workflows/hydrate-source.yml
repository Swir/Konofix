name: Hydrate Konofix source

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/part_*'
      - '.github/workflows/hydrate-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify Konofix Chat 0.4.1 archive
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name 'part_[0-9][0-9]' -print | sort)
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "No bootstrap parts found"
            exit 1
          fi

          echo "Found ${#parts[@]} bootstrap parts:"
          printf ' - %s\n' "${parts[@]}"

          cat "${parts[@]}" | tr -d '\r\n' > /tmp/konofix-source.b64
          echo "Base64 characters: $(wc -c < /tmp/konofix-source.b64)"

          base64 --decode /tmp/konofix-source.b64 > /tmp/konofix-source.zip
          echo "ZIP bytes: $(wc -c < /tmp/konofix-source.zip)"

          unzip -t /tmp/konofix-source.zip
          rm -rf /tmp/konofix-source
          mkdir -p /tmp/konofix-source
          unzip -q /tmp/konofix-source.zip -d /tmp/konofix-source

          test -f /tmp/konofix-source/src-tauri/Cargo.toml
          test -f /tmp/konofix-source/src/main.ts
          test -f /tmp/konofix-source/ROADMAP.md

      - name: Replace bootstrap files with project source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          for item in /tmp/konofix-source/*; do
            cp -a "$item" ./
          done
          rm -rf .bootstrap
          rm -f .github/workflows/hydrate-source.yml

      - name: Commit hydrated project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Import full Konofix Chat 0.4.1 source"
          git push origin HEAD:main
