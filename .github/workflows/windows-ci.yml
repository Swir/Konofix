name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: x86_64-pc-windows-msvc
          toolchain: stable
          components: rustfmt, clippy

      - name: Release metadata gate
        shell: pwsh
        run: .\scripts\release-gate.ps1

      - name: Release artifact naming self-tests
        shell: pwsh
        run: .\scripts\test-release-artifact-name.ps1

      - name: Exact-build tester handoff self-tests
        shell: pwsh
        run: .\scripts\test-tester-handoff.ps1

      - name: Network evidence snapshot self-tests
        shell: pwsh
        run: .\scripts\test-evidence-snapshot.ps1

      - name: Network evidence gate self-tests
        shell: pwsh
        run: .\scripts\test-network-evidence-gate.ps1

      - name: Client public-node Netprobe evidence self-tests
        shell: pwsh
        run: .\scripts\test-client-netprobe-evidence.ps1

      - name: Promotion evidence preflight self-tests
        shell: pwsh
        run: .\scripts\test-promotion-evidence.ps1

      - name: Network report editor self-tests
        shell: pwsh
        run: .\scripts\test-network-report-editor.ps1

      - name: Network test session bootstrap self-tests
        shell: pwsh
        run: .\scripts\test-network-test-session.ps1

      - name: Internet bootstrap precheck self-tests
        shell: pwsh
        run: .\scripts\test-internet-precheck.ps1

      - name: Public Node deployment self-tests
        shell: pwsh
        run: .\scripts\test-public-node.ps1

      - name: Public Node startup-task self-tests
        shell: pwsh
        run: .\scripts\test-public-node-task.ps1

      - name: Public Node readiness self-tests
        shell: pwsh
        run: .\scripts\test-public-node-readiness.ps1

      - name: Node health validator self-tests
        shell: pwsh
        run: .\scripts\test-node-health.ps1

      - name: Node soak stability self-tests
        shell: pwsh
        run: .\scripts\test-node-soak.ps1

      - name: Node soak collector self-tests
        shell: pwsh
        run: .\scripts\test-node-soak-collector.ps1

      - name: Global beta concurrent admission self-tests
        shell: pwsh
        run: .\scripts\test-global-beta-load.ps1

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Project consistency and localization audit
        run: npm run audit

      - name: TypeScript + Vite build
        run: npm run build

      - name: Rust lockfile metadata gate
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo Clippy - correctness, suspicious and performance gates
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

      - name: Cargo test - all targets
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Cargo check - Konofix Chat
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Cargo check - Konofix Node
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --bin konofix-node

      - name: Cargo check - Konofix Netprobe
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --bin konofix-netprobe

      - name: Build production Windows app
        run: npm run tauri build

      - name: Installed Chat startup smoke
        shell: pwsh
        run: .\scripts\test-chat-installer.ps1

      - name: Upload failed Chat startup build for diagnosis
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Konofix-Chat-startup-diagnostic-${{ github.sha }}
          path: |
            src-tauri/target/release/konofix-chat.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore
          retention-days: 3

      - name: Build production Konofix Node
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release --bin konofix-node

      - name: Build production Konofix Netprobe
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release --bin konofix-netprobe

      - name: Production Node runtime smoke
        shell: pwsh
        run: .\scripts\test-node-runtime.ps1

      - name: Stage Windows test bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          New-Item -ItemType Directory -Force -Path 'artifact\scripts' | Out-Null
          Copy-Item 'src-tauri\target\release\konofix-node.exe' 'artifact\konofix-node.exe'
          Copy-Item 'src-tauri\target\release\konofix-netprobe.exe' 'artifact\konofix-netprobe.exe'
          if (-not (Test-Path 'src-tauri\target\release\bundle' -PathType Container)) { throw 'Tauri Windows bundle directory is missing.' }
          Copy-Item 'src-tauri\target\release\bundle' 'artifact\bundle' -Recurse -Force
          Copy-Item 'README.md' 'artifact\README.md'
          Copy-Item 'docs\TESTING.md' 'artifact\TESTING.md'
          Copy-Item 'docs\NODE.md' 'artifact\NODE.md'
          Copy-Item 'docs\NODE_SOAK.md' 'artifact\NODE_SOAK.md'
          Copy-Item 'docs\GLOBAL_BETA.md' 'artifact\GLOBAL_BETA.md'
          New-Item -ItemType Directory -Path 'artifact\docs' | Out-Null
          Copy-Item 'docs\global-beta-evidence.template.json', 'docs\RELEASE_0.4.2_BETA1.md' 'artifact\docs'
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          & .\scripts\new-tester-handoff.ps1 -OutputPath 'artifact\TESTER_HANDOFF.md' -Version ([string]$package.version) -Commit ([string]$env:GITHUB_SHA) -WorkflowRun ([string]$env:GITHUB_RUN_ID)

          $testTools = @(
            'new-rooms2-live-evidence.ps1',
            'validate-rooms2-live-evidence.ps1',
            'validate-global-beta-evidence.mjs',
            'internet-test.ps1',
            'global-beta-load.ps1',
            'capture-client-netprobe.ps1',
            'validate-client-netprobe.ps1',
            'public-node.ps1',
            'install-public-node-task.ps1',
            'check-public-node-readiness.ps1',
            'new-network-test-session.ps1',
            'new-network-test-report.ps1',
            'set-network-test-result.ps1',
            'validate-network-test-report.ps1',
            'validate-network-test-session.ps1',
            'evidence-snapshot.ps1',
            'path-identity.ps1',
            'check-promotion-evidence.ps1',
            'check-node-health.ps1',
            'test-node-runtime.ps1',
            'collect-node-soak.ps1',
            'validate-node-soak.ps1'
          )
          foreach ($tool in $testTools) {
            Copy-Item (Join-Path 'scripts' $tool) (Join-Path 'artifact\scripts' $tool)
          }

          if (-not (Test-Path 'package-lock.json' -PathType Leaf)) { throw 'Committed package-lock.json is missing.' }
          Copy-Item 'package-lock.json' 'artifact\package-lock.json'
          if (-not (git ls-files --error-unmatch -- 'src-tauri/Cargo.lock' 2>$null)) { throw 'Committed src-tauri/Cargo.lock is missing from Git tracking.' }
          if (-not (Test-Path 'src-tauri\Cargo.lock' -PathType Leaf)) { throw 'Committed src-tauri/Cargo.lock is missing from the build workspace.' }
          Copy-Item 'src-tauri\Cargo.lock' 'artifact\Cargo.lock'

          $artifactRoot = (Resolve-Path 'artifact').Path
          $nodePath = Join-Path $artifactRoot 'konofix-node.exe'
          $netprobePath = Join-Path $artifactRoot 'konofix-netprobe.exe'
          $frontendLockPath = Join-Path $artifactRoot 'package-lock.json'
          $cargoLockPath = Join-Path $artifactRoot 'Cargo.lock'
          $installerFiles = @(Get-ChildItem (Join-Path $artifactRoot 'bundle') -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.msi') })
          if ($installerFiles.Count -eq 0) { throw 'No Windows installer was produced by the Tauri build.' }
          $toolFiles = @(Get-ChildItem (Join-Path $artifactRoot 'scripts') -File)
          if ($toolFiles.Count -ne $testTools.Count) { throw 'Windows test bundle is missing one or more operator/test scripts.' }

          $installerInfo = @($installerFiles | ForEach-Object {
            [ordered]@{
              path = [IO.Path]::GetRelativePath($artifactRoot, $_.FullName).Replace('\', '/')
              bytes = [int64]$_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $toolInfo = @($toolFiles | Sort-Object Name | ForEach-Object {
            [ordered]@{
              path = [IO.Path]::GetRelativePath($artifactRoot, $_.FullName).Replace('\', '/')
              bytes = [int64]$_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $completeInventory = @(Get-ChildItem $artifactRoot -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($artifactRoot, $_.FullName).Replace('\', '/')
            if ([string]::Equals($relative, 'BUILD_INFO.json', [System.StringComparison]::OrdinalIgnoreCase)) {
              throw 'BUILD_INFO.json must not exist before the complete bundle inventory is sealed.'
            }
            [ordered]@{
              path = $relative
              bytes = [int64]$_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          if ($completeInventory.Count -lt 10) { throw 'Windows bundle inventory is unexpectedly small.' }

          $buildInfo = [ordered]@{
            schema = 2
            product = 'Konofix Chat'
            version = [string]$package.version
            commit = [string]$env:GITHUB_SHA
            workflow_run = [string]$env:GITHUB_RUN_ID
            generated_utc = [DateTimeOffset]::UtcNow.ToString('o')
            node = [ordered]@{
              path = 'konofix-node.exe'
              bytes = [int64](Get-Item $nodePath).Length
              sha256 = (Get-FileHash $nodePath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            netprobe = [ordered]@{
              path = 'konofix-netprobe.exe'
              bytes = [int64](Get-Item $netprobePath).Length
              sha256 = (Get-FileHash $netprobePath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            frontend_lock = [ordered]@{
              path = 'package-lock.json'
              bytes = [int64](Get-Item $frontendLockPath).Length
              sha256 = (Get-FileHash $frontendLockPath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            rust_lock = [ordered]@{
              path = 'Cargo.lock'
              bytes = [int64](Get-Item $cargoLockPath).Length
              sha256 = (Get-FileHash $cargoLockPath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            installers = $installerInfo
            tools = $toolInfo
            files = $completeInventory
          }
          $buildInfo | ConvertTo-Json -Depth 7 | Set-Content 'artifact\BUILD_INFO.json' -Encoding utf8
          Get-ChildItem artifact -Recurse | Select-Object FullName, Length

      - name: Smoke staged Node bundle
        shell: pwsh
        run: .\artifact\scripts\test-node-runtime.ps1

      - name: Create release ZIP and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $zip = & .\scripts\release-artifact-name.ps1 -Version ([string]$package.version) -Commit ([string]$env:GITHUB_SHA)
          if ([string]::IsNullOrWhiteSpace($zip)) { throw 'Release artifact naming helper returned an empty path.' }
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'artifact\*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "Archive: $zip"
          Write-Host "SHA256: $hash"

      - name: Verify release artifact integrity
        shell: pwsh
        run: .\scripts\verify-release.ps1 -ZipPath $env:RELEASE_ZIP -ChecksumPath "$env:RELEASE_ZIP.sha256"

      - name: Adversarial Windows bundle provenance smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $sourceZip = [string]$env:RELEASE_ZIP
          if ([string]::IsNullOrWhiteSpace($sourceZip) -or -not (Test-Path -LiteralPath $sourceZip -PathType Leaf)) {
            throw 'Canonical exact-build release ZIP is unavailable to adversarial verification.'
          }

          function Add-ZipEntry([string]$ZipPath, [string]$EntryName, [string]$Content) {
            $archive = [System.IO.Compression.ZipFile]::Open($ZipPath, [System.IO.Compression.ZipArchiveMode]::Update)
            try {
              $entry = $archive.CreateEntry($EntryName, [System.IO.Compression.CompressionLevel]::Optimal)
              $stream = $entry.Open()
              $writer = [System.IO.StreamWriter]::new($stream, [System.Text.UTF8Encoding]::new($false))
              try { $writer.Write($Content) } finally { $writer.Dispose() }
            } finally {
              $archive.Dispose()
            }
          }

          function Write-ZipChecksum([string]$ZipPath, [string]$ChecksumPath, [string]$RecordedName = '') {
            $hash = (Get-FileHash $ZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([string]::IsNullOrWhiteSpace($RecordedName)) { $RecordedName = [IO.Path]::GetFileName($ZipPath) }
            "$hash  $RecordedName" | Set-Content $ChecksumPath -Encoding ascii
          }

          function New-CanonicalTempCopy {
            $directory = Join-Path $env:RUNNER_TEMP ("konofix-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            $zip = Join-Path $directory ([IO.Path]::GetFileName($sourceZip))
            Copy-Item -LiteralPath $sourceZip -Destination $zip -Force
            return [pscustomobject]@{
              Directory = $directory
              Zip = $zip
              Checksum = "$zip.sha256"
            }
          }

          function Expect-VerifyFailure([string]$Label, [string]$EntryName, [string]$ExpectedPattern, [string]$Content = 'tamper-test') {
            $copy = New-CanonicalTempCopy
            try {
              Add-ZipEntry -ZipPath $copy.Zip -EntryName $EntryName -Content $Content
              Write-ZipChecksum -ZipPath $copy.Zip -ChecksumPath $copy.Checksum
              $rejected = $false
              try {
                & .\scripts\verify-release.ps1 -ZipPath $copy.Zip -ChecksumPath $copy.Checksum | Out-Null
              } catch {
                if ($_.Exception.Message -notmatch $ExpectedPattern) {
                  throw "${Label}: verifier rejected the archive for an unexpected reason: $($_.Exception.Message)"
                }
                $rejected = $true
              }
              if (-not $rejected) { throw "${Label}: verifier accepted a tampered archive." }
              Write-Host "Expected rejection passed: $Label"
            } finally {
              Remove-Item -LiteralPath $copy.Directory -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          function Expect-ChecksumNameFailure {
            $copy = New-CanonicalTempCopy
            try {
              Write-ZipChecksum -ZipPath $copy.Zip -ChecksumPath $copy.Checksum -RecordedName 'different-release.zip'
              $rejected = $false
              try {
                & .\scripts\verify-release.ps1 -ZipPath $copy.Zip -ChecksumPath $copy.Checksum | Out-Null
              } catch {
                if ($_.Exception.Message -notmatch 'names a different archive') {
                  throw "checksum filename binding: verifier rejected the checksum for an unexpected reason: $($_.Exception.Message)"
                }
                $rejected = $true
              }
              if (-not $rejected) { throw 'checksum filename binding: verifier accepted a checksum naming a different archive.' }
              Write-Host 'Expected rejection passed: checksum filename binding'
            } finally {
              Remove-Item -LiteralPath $copy.Directory -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          function Expect-ArchiveNameFailure {
            $directory = Join-Path $env:RUNNER_TEMP ("konofix-renamed-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            $badZip = Join-Path $directory 'renamed-release.zip'
            $badChecksum = "$badZip.sha256"
            Copy-Item -LiteralPath $sourceZip -Destination $badZip -Force
            try {
              Write-ZipChecksum -ZipPath $badZip -ChecksumPath $badChecksum
              $rejected = $false
              try {
                & .\scripts\verify-release.ps1 -ZipPath $badZip -ChecksumPath $badChecksum | Out-Null
              } catch {
                if ($_.Exception.Message -notmatch 'filename is not bound to exact build identity') {
                  throw "archive filename binding: verifier rejected the renamed archive for an unexpected reason: $($_.Exception.Message)"
                }
                $rejected = $true
              }
              if (-not $rejected) { throw 'archive filename binding: verifier accepted a renamed exact-build archive.' }
              Write-Host 'Expected rejection passed: archive filename binding'
            } finally {
              Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          Expect-ChecksumNameFailure
          Expect-ArchiveNameFailure
          Expect-VerifyFailure -Label 'unexpected file inventory' -EntryName 'UNEXPECTED.txt' -ExpectedPattern 'inventory'
          Expect-VerifyFailure -Label 'parent-directory traversal entry' -EntryName '../escape.txt' -ExpectedPattern 'unsafe|parent-directory'
          Expect-VerifyFailure -Label 'reserved Windows device alias' -EntryName 'NUL.txt' -ExpectedPattern 'reserved Windows device'
          Expect-VerifyFailure -Label 'trailing-dot Windows alias' -EntryName 'alias.txt.' -ExpectedPattern 'Windows-aliased dot or space'
          Expect-VerifyFailure -Label 'high-ratio decompression bomb' -EntryName 'compression-bomb.txt' -ExpectedPattern 'compression ratio|expanded size' -Content ('A' * 8MB)

      - name: Upload Windows test bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Konofix-Chat-0.4.2-Windows-${{ github.sha }}
          path: |
            artifact
            Konofix-Chat-*-Windows-${{ github.sha }}.zip
            Konofix-Chat-*-Windows-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-beta:
    needs: check-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Swir/Konofix'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Download this build's verified Windows bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Konofix-Chat-0.4.2-Windows-${{ github.sha }}
          path: downloaded
      - name: Prepare exact-build beta files
        shell: pwsh
        run: .\scripts\prepare-beta.ps1
      - name: Publish beta after Windows, Linux and RustSec pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-beta.mjs
