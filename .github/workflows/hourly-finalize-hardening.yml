name: Hourly finalize room and evidence hardening

on:
  push:
    branches:
      - automation/room-evidence-hardening-20260918

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply final portability fix and remove staging workflows
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'scripts/validate-network-test-report.ps1',
              '$manifestFile = Get-Item -LiteralPath $path\n',
              '$manifestFile = Get-Item -LiteralPath $path -Force\n',
          )
          replace_once(
              'scripts/set-network-test-result.ps1',
              '$newManifestItem = Get-Item -LiteralPath $manifestTemp\n',
              '$newManifestItem = Get-Item -LiteralPath $manifestTemp -Force\n',
          )

          for name in (
              '.github/workflows/hourly-reseal-fix.yml',
              '.github/workflows/hourly-reseal-rescue.yml',
              '.github/workflows/hourly-hidden-temp-fix.yml',
              '.github/workflows/hourly-finalize-hardening.yml',
          ):
              p = Path(name)
              if p.exists():
                  p.unlink()

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Project audit
        run: npm run audit

      - name: Report editor self-tests
        shell: pwsh
        run: ./scripts/test-network-report-editor.ps1

      - name: Session lifecycle self-tests
        shell: pwsh
        run: ./scripts/test-network-test-session.ps1

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Diff hygiene
        run: |
          git diff --check
          test ! -e .github/workflows/hourly-reseal-fix.yml
          test ! -e .github/workflows/hourly-reseal-rescue.yml
          test ! -e .github/workflows/hourly-hidden-temp-fix.yml
          test ! -e .github/workflows/hourly-finalize-hardening.yml
          grep -q 'Get-Item -LiteralPath $path -Force' scripts/validate-network-test-report.ps1
          grep -q 'Get-Item -LiteralPath $manifestTemp -Force' scripts/set-network-test-result.ps1
          grep -q 'sessionInventoryEntry.sha256' scripts/set-network-test-result.ps1
          grep -q 'Authorized evidence edit did not reseal manifest SHA-256' scripts/test-network-test-session.ps1

      - name: Commit final integration
        env:
          BRANCH: automation/room-evidence-hardening-20260918
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize room and evidence integrity hardening'
          git push origin HEAD:$BRANCH
