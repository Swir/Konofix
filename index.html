<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0d17" />
    <title>Konofix Chat</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const errors = [];
        const stringify = value => {
          if (value instanceof Error) return value.stack || value.message || value.name;
          if (typeof value === 'string') return value;
          try { return JSON.stringify(value); } catch { return String(value); }
        };
        const remember = value => {
          const message = stringify(value).slice(0, 3000);
          if (!message) return;
          errors.push(message);
          if (errors.length > 8) errors.shift();
          try { localStorage.setItem('konofix.lastStartupError', errors.join('\n---\n')); } catch {}
        };
        const show = (message, fatal) => {
          remember(message);
          let panel = document.getElementById('konofixStartupError');
          if (!panel) {
            panel = document.createElement('section');
            panel.id = 'konofixStartupError';
            panel.setAttribute('role', 'alert');
            panel.style.cssText =
              'position:fixed;z-index:2147483647;left:18px;right:18px;bottom:18px;max-height:45vh;overflow:auto;' +
              'padding:14px 16px;border:1px solid #ff5d78;border-radius:12px;background:#17070d;color:#fff;' +
              'font:13px/1.45 system-ui,Segoe UI,sans-serif;box-shadow:0 18px 60px rgba(0,0,0,.55)';
            document.body.appendChild(panel);
          }
          panel.innerHTML =
            '<strong>Konofix startup problem</strong><br>' +
            '<span>' + String(message).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])) + '</span>' +
            '<br><small>Diagnostic saved locally as konofix.lastStartupError.</small>';
          if (fatal) {
            const app = document.getElementById('app');
            if (app && !app.childElementCount) {
              app.innerHTML =
                '<main aria-label="Konofix startup recovery" style="min-height:100vh;display:grid;place-items:center;padding:32px;color:#f4faff;background:#070913;font:16px system-ui,Segoe UI,sans-serif">' +
                '<section style="max-width:720px"><h1>Konofix could not render the main interface.</h1>' +
                '<p>The application stayed open, but the frontend did not finish starting. The diagnostic panel below contains the startup error.</p></section></main>';
            }
          }
        };
        window.addEventListener('error', event => remember(event.error || event.message));
        window.addEventListener('unhandledrejection', event => remember(event.reason));
        window.addEventListener('konofix-module-error', event => {
          const detail = event.detail || {};
          show((detail.module || 'Optional UI module') + ': ' + (detail.error || 'failed to load'), false);
        });
        window.setTimeout(() => {
          if (document.documentElement.dataset.konofixCoreReady === 'true') return;
          const detail = errors.length ? ': ' + errors[errors.length - 1] : '';
          show('Core UI did not finish starting within 2.5 seconds' + detail, true);
        }, 2500);
        window.setTimeout(() => {
          const app = document.getElementById('app');
          if (app && app.childElementCount === 0) show('The main UI became empty during startup.', true);
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/startup-ui-loader.ts"></script>
  </body>
</html>
