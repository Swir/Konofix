name: Apply nickname lease hardening 95

on:
  push:
    branches: [ hardening/dht-nickname-hints-95 ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/dht-nickname-hints-95
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply fail-closed nickname trust patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          lib_path = Path("src-tauri/src/lib.rs")
          lib = lib_path.read_text(encoding="utf-8")
          lib = replace_once(
              lib,
              "const NICK_LEASE_SECS: u64 = 42;\n",
              "const NICK_LEASE_SECS: u64 = 42;\nconst NICK_LEASE_CLOCK_SKEW_SECS: u64 = 5;\n",
              "nickname skew constant",
          )

          helper = r'''fn nick_lease_hint_is_well_formed(
              lease: &NickLease,
              record_key: &RecordKey,
              now: u128,
          ) -> bool {
              let Ok(peer) = lease.peer_id.parse::<PeerId>() else {
                  return false;
              };
              if peer.to_string() != lease.peer_id {
                  return false;
              }
              let Ok(valid_nick) = validate_nick(&lease.nick) else {
                  return false;
              };
              let expected_canonical = canonical_nick(&valid_nick);
              if lease.canonical != expected_canonical {
                  return false;
              }
              let expected_key = nick_record_key(&expected_canonical);
              if record_key.as_ref() != expected_key.as_ref() {
                  return false;
              }
              let max_expires = now.saturating_add(
                  (NICK_LEASE_SECS.saturating_add(NICK_LEASE_CLOCK_SKEW_SECS) as u128)
                      .saturating_mul(1000),
              );
              lease.expires_at > now && lease.expires_at <= max_expires
          }

          '''
          lib = replace_once(
              lib,
              "fn check_nick_conflict(\n",
              helper + "fn check_nick_conflict(\n",
              "nickname hint validator insertion",
          )

          old_dht = r'''                        kad::QueryResult::GetRecord(Ok(GetRecordOk::FoundRecord(peer_record))) => {
                              if let Ok(lease) = serde_json::from_slice::<NickLease>(&peer_record.record.value) {
                                  if check_nick_conflict(&lease.peer_id, &lease.canonical, lease.expires_at, local_peer, &canonical) {
                                      let _ = app.emit("nick-conflict", serde_json::json!({"nick": nick, "peer_id": lease.peer_id}));
                                      break 'network;
                                  }
                              }
                          }
          '''
          new_dht = r'''                        kad::QueryResult::GetRecord(Ok(GetRecordOk::FoundRecord(peer_record))) => {
                              if let Ok(lease) = serde_json::from_slice::<NickLease>(&peer_record.record.value) {
                                  // Kademlia record.publisher and payload Peer IDs are not cryptographic proof
                                  // of application-level nickname ownership. Until the lease format carries a
                                  // verifiable signature, DHT records are validated hints only and must never
                                  // trigger a local nickname conflict or disconnect.
                                  if !nick_lease_hint_is_well_formed(
                                      &lease,
                                      &peer_record.record.key,
                                      now_ms(),
                                  ) {
                                      let _ = app.emit(
                                          "network-warning",
                                          "Dropped malformed or unbounded DHT nickname hint.",
                                      );
                                  }
                              }
                          }
          '''
          lib = replace_once(lib, old_dht, new_dht, "DHT nickname authority removal")

          tests = r'''#[cfg(test)]
          mod nickname_lease_hint_tests {
              use super::*;

              fn test_peer() -> PeerId {
                  libp2p::identity::Keypair::generate_ed25519()
                      .public()
                      .to_peer_id()
              }

              fn lease(peer: PeerId, nick: &str, expires_at: u128) -> NickLease {
                  NickLease {
                      peer_id: peer.to_string(),
                      nick: nick.to_string(),
                      canonical: canonical_nick(nick),
                      expires_at,
                  }
              }

              #[test]
              fn live_hint_requires_matching_key_identity_and_canonical_nick() {
                  let now = 1_000_000u128;
                  let lease = lease(
                      test_peer(),
                      "Alice",
                      now + (NICK_LEASE_SECS as u128 * 1000),
                  );
                  let key = nick_record_key(&lease.canonical);
                  assert!(nick_lease_hint_is_well_formed(&lease, &key, now));

                  let wrong_key = nick_record_key("mallory");
                  assert!(!nick_lease_hint_is_well_formed(&lease, &wrong_key, now));

                  let mut wrong_canonical = lease.clone();
                  wrong_canonical.canonical = "mallory".into();
                  assert!(!nick_lease_hint_is_well_formed(
                      &wrong_canonical,
                      &key,
                      now
                  ));

                  let mut invalid_peer = lease.clone();
                  invalid_peer.peer_id = "not-a-peer-id".into();
                  assert!(!nick_lease_hint_is_well_formed(&invalid_peer, &key, now));
              }

              #[test]
              fn hint_expiration_is_fail_closed_and_bounded() {
                  let now = 2_000_000u128;
                  let peer = test_peer();
                  let expired = lease(peer, "Alice", now);
                  let key = nick_record_key(&expired.canonical);
                  assert!(!nick_lease_hint_is_well_formed(&expired, &key, now));

                  let too_far = lease(
                      test_peer(),
                      "Alice",
                      now + ((NICK_LEASE_SECS + NICK_LEASE_CLOCK_SKEW_SECS + 1) as u128 * 1000),
                  );
                  assert!(!nick_lease_hint_is_well_formed(&too_far, &key, now));
              }
          }

          '''
          lib = replace_once(
              lib,
              "#[cfg(test)]\nmod network_session_state_tests {\n",
              tests + "#[cfg(test)]\nmod network_session_state_tests {\n",
              "nickname trust tests insertion",
          )
          lib_path.write_text(lib, encoding="utf-8")

          checker = r'''import fs from "node:fs";
          import process from "node:process";
          import { fileURLToPath } from "node:url";

          export function checkNicknameLeaseTrust(source) {
            const errors = [];
            const dhtStart = source.indexOf("kad::QueryResult::GetRecord(Ok(GetRecordOk::FoundRecord(peer_record))) => {");
            const dhtEnd = dhtStart >= 0 ? source.indexOf("\n                        _ => {}", dhtStart) : -1;
            if (dhtStart < 0 || dhtEnd < 0) {
              errors.push("unable to isolate DHT GetRecord handling");
            } else {
              const dhtBlock = source.slice(dhtStart, dhtEnd);
              if (!dhtBlock.includes("nick_lease_hint_is_well_formed(")) {
                errors.push("DHT nickname records must pass the bounded hint validator");
              }
              if (dhtBlock.includes("check_nick_conflict(")) {
                errors.push("unsigned DHT nickname records must never invoke conflict authority");
              }
              if (dhtBlock.includes('app.emit("nick-conflict"')) {
                errors.push("unsigned DHT nickname records must never emit nick-conflict");
              }
            }
            for (const required of [
              "fn nick_lease_hint_is_well_formed(",
              "record_key.as_ref() != expected_key.as_ref()",
              "lease.expires_at > now && lease.expires_at <= max_expires",
              "NICK_LEASE_CLOCK_SKEW_SECS",
            ]) {
              if (!source.includes(required)) errors.push(`missing nickname hint guard: ${required}`);
            }
            const gossipStart = source.indexOf("SwarmEvent::Behaviour(BehaviourEvent::Gossipsub");
            if (gossipStart < 0) {
              errors.push("unable to isolate authenticated GossipSub path");
            } else {
              const gossipBlock = source.slice(gossipStart, gossipStart + 14000);
              if (!gossipBlock.includes("wire_event_matches_source(&event, authenticated_source)")) {
                errors.push("GossipSub payload identity must stay bound to authenticated source");
              }
              if (!gossipBlock.includes("WireEvent::NickClaim") || !gossipBlock.includes("check_nick_conflict(")) {
                errors.push("authenticated GossipSub NickClaim must retain deterministic conflict handling");
              }
            }
            return errors;
          }

          export function assertNicknameLeaseTrust(source) {
            const errors = checkNicknameLeaseTrust(source);
            if (errors.length) throw new Error(errors.join("\n"));
          }

          if (process.argv[1] === fileURLToPath(import.meta.url)) {
            const source = fs.readFileSync(new URL("../src-tauri/src/lib.rs", import.meta.url), "utf8");
            const errors = checkNicknameLeaseTrust(source);
            if (errors.length) {
              for (const error of errors) console.error(`nickname-lease-trust: ${error}`);
              process.exit(1);
            }
            console.log("nickname-lease-trust: policy verified");
          }
          '''
          Path("scripts/check-nickname-lease-trust.mjs").write_text(checker, encoding="utf-8")

          adversarial = r'''import fs from "node:fs";
          import { checkNicknameLeaseTrust } from "./check-nickname-lease-trust.mjs";

          const source = fs.readFileSync(new URL("../src-tauri/src/lib.rs", import.meta.url), "utf8");
          const baseline = checkNicknameLeaseTrust(source);
          if (baseline.length) throw new Error(`baseline policy failed: ${baseline.join("; ")}`);

          const mutations = [
            [
              "remove DHT hint validation",
              s => s.replace("if !nick_lease_hint_is_well_formed(\n", "if !(\n"),
            ],
            [
              "restore DHT conflict authority",
              s => s.replace(
                "if !nick_lease_hint_is_well_formed(\n",
                "if check_nick_conflict(&lease.peer_id, &lease.canonical, lease.expires_at, local_peer, &canonical) || !nick_lease_hint_is_well_formed(\n",
              ),
            ],
            [
              "drop DHT key binding",
              s => s.replace("record_key.as_ref() != expected_key.as_ref()", "false"),
            ],
            [
              "drop lease upper bound",
              s => s.replace(
                "lease.expires_at > now && lease.expires_at <= max_expires",
                "lease.expires_at > now",
              ),
            ],
            [
              "drop GossipSub source binding",
              s => s.replace("wire_event_matches_source(&event, authenticated_source)", "true"),
            ],
          ];

          let rejected = 0;
          for (const [name, mutate] of mutations) {
            const changed = mutate(source);
            if (changed === source) throw new Error(`${name}: mutation did not apply`);
            const errors = checkNicknameLeaseTrust(changed);
            if (!errors.length) throw new Error(`${name}: unsafe mutation was accepted`);
            rejected += 1;
          }
          console.log(`nickname-lease-trust adversarial: ${rejected}/${mutations.length} unsafe mutations rejected`);
          '''
          Path("scripts/test-nickname-lease-trust.mjs").write_text(adversarial, encoding="utf-8")

          pkg_path = Path("package.json")
          pkg = json.loads(pkg_path.read_text(encoding="utf-8"))
          marker = "node scripts/test-network-session-lifecycle.mjs && node scripts/check-network-session-lifecycle.mjs"
          insertion = "node scripts/test-nickname-lease-trust.mjs && node scripts/check-nickname-lease-trust.mjs && " + marker
          if marker not in pkg["scripts"]["audit"]:
              raise SystemExit("package audit anchor missing")
          pkg["scripts"]["audit"] = pkg["scripts"]["audit"].replace(marker, insertion, 1)
          pkg["scripts"]["audit:nickname-lease-trust"] = "node scripts/check-nickname-lease-trust.mjs"
          pkg["scripts"]["test:nickname-lease-trust"] = "node scripts/test-nickname-lease-trust.mjs"
          pkg_path.write_text(json.dumps(pkg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          doc = '''# Nickname trust boundary\n\nKonofix uses two transports for nickname reservation signals, but they do not have the same authority.\n\n## Authoritative path\n\nGossipSub messages are signed by libp2p and the application requires the payload Peer ID to match the authenticated message source. A well-formed `NickClaim` from that path may therefore participate in deterministic nickname conflict resolution.\n\n## DHT path\n\nThe current JSON `NickLease` stored in Kademlia does not carry an application-level signature. Neither the payload `peer_id` nor Kademlia `record.publisher` is treated as proof that the claimed Peer ID created the lease. DHT nickname records are therefore **non-authoritative hints only**.\n\nBefore an unsigned hint is even accepted as structurally plausible, Konofix verifies the Peer ID syntax, nickname validation/canonicalization, exact DHT key, non-expired timestamp, and an upper lifetime bound equal to the configured lease window plus a small clock-skew allowance. Valid hints do not emit `nick-conflict` and cannot disconnect or reject the local nickname.\n\nA future signed lease format may restore authoritative DHT conflict resolution only after the signature covers the protocol/domain, canonical and display nickname, publisher Peer ID and expiration, and the public key is proven to derive the claimed Peer ID.\n\n## Regression policy\n\n`scripts/check-nickname-lease-trust.mjs` is wired into `npm run audit`; its adversarial companion mutates source-policy invariants and requires each unsafe variant to be rejected. Rust unit tests cover record-key/canonical/identity validation and bounded expiration.\n'''
          Path("docs/NICKNAME_SECURITY.md").write_text(doc, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog_anchor = "## 0.4.2\n\n"
          changelog_entry = "- hardened distributed nickname reservation so unsigned Kademlia `NickLease` records are non-authoritative hints only: DHT payloads can no longer trigger `nick-conflict` or disconnect a client, plausible hints are bounded by Peer ID/nickname/canonical key/lifetime validation, authenticated GossipSub claims retain deterministic conflict handling, and Rust plus adversarial source-policy tests guard the trust boundary without adding Real Internet Test credit,\n"
          if changelog_entry not in changelog:
              changelog = replace_once(changelog, changelog_anchor, changelog_anchor + changelog_entry, "changelog 0.4.2 anchor")
          changelog_path.write_text(changelog, encoding="utf-8")

          roadmap_path = Path("ROADMAP.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          roadmap_anchor = "The active milestone currently has 54 of 59 tasks complete. The remaining five tasks require real public-network evidence and fixes discovered during those tests; CI alone cannot credit them.\n"
          roadmap_note = "\n- Distributed nickname trust hardening now treats unsigned Kademlia nickname leases as bounded, non-authoritative hints; only source-authenticated GossipSub claims can enforce a nickname conflict. This security fix adds no Real Internet Test credit.\n"
          if roadmap_note.strip() not in roadmap:
              roadmap = replace_once(roadmap, roadmap_anchor, roadmap_anchor + roadmap_note, "roadmap active milestone anchor")
          roadmap_path.write_text(roadmap, encoding="utf-8")
          PY

      - name: Format and verify focused changes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          node scripts/test-nickname-lease-trust.mjs
          node scripts/check-nickname-lease-trust.mjs
          npm ci
          npm run audit
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check

      - name: Commit verified patch and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-nickname-hardening-95.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs package.json scripts/check-nickname-lease-trust.mjs scripts/test-nickname-lease-trust.mjs docs/NICKNAME_SECURITY.md CHANGELOG.md ROADMAP.md .github/workflows/automation-nickname-hardening-95.yml
          git diff --cached --check
          git commit -m "Harden DHT nickname lease trust boundary"
          git push origin HEAD:hardening/dht-nickname-hints-95
