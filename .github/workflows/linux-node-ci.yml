name: Linux Node CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: linux-node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt

      - name: Isolated Node manifest/source parity self-tests
        run: python3 scripts/check-node-linux-parity.py self-test

      - name: Isolated Node manifest/source parity gate
        run: python3 scripts/check-node-linux-parity.py check

      - name: Prepare isolated Node lockfile
        shell: bash
        run: cp src-tauri/Cargo.lock node-linux/Cargo.lock

      - name: Locked Rust metadata
        run: cargo metadata --locked --manifest-path node-linux/Cargo.toml --no-deps --format-version 1 >/dev/null

      - name: Rust format check
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path node-linux/Cargo.toml -- --check

      - name: Headless dependency gate
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --manifest-path node-linux/Cargo.toml --target x86_64-unknown-linux-gnu --edges normal,build > node-linux-deps.txt
          if grep -E '(^|[[:space:]])(tauri|tauri-build|rfd) v' node-linux-deps.txt; then
            echo 'Linux Node dependency graph unexpectedly contains desktop GUI dependencies.' >&2
            grep -E '(^|[[:space:]])(tauri|tauri-build|rfd) v' node-linux-deps.txt >&2 || true
            exit 1
          fi

      - name: Linux bundle provenance self-tests
        shell: bash
        run: python3 scripts/linux-bundle-provenance.py self-test

      - name: Konofix Node tests
        run: cargo test --locked --manifest-path node-linux/Cargo.toml --bin konofix-node

      - name: Konofix Netprobe tests
        run: cargo test --locked --manifest-path node-linux/Cargo.toml --bin konofix-netprobe

      - name: Build release Linux Node and Netprobe
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: cargo build --locked --manifest-path node-linux/Cargo.toml --release --bin konofix-node --bin konofix-netprobe

      - name: Linux Node runtime smoke
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node_binary="$GITHUB_WORKSPACE/node-linux/target/release/konofix-node"
          probe_binary="$GITHUB_WORKSPACE/node-linux/target/release/konofix-netprobe"
          test -x "$node_binary"
          test -x "$probe_binary"
          "$node_binary" --help | grep -F 'Konofix Node 0.5.1'
          "$node_binary" --help | grep -F -- '--identity-file'
          "$node_binary" --help | grep -F -- '--health-file'
          "$probe_binary" --help | grep -F 'Konofix Netprobe 0.5.1'

          runtime_dir="$(mktemp -d)"
          identity="$runtime_dir/node-identity.key"
          health="$runtime_dir/node-health.json"
          log="$runtime_dir/node.log"
          pid=''

          cleanup() {
            if [[ -n "${pid:-}" ]] && kill -0 "$pid" 2>/dev/null; then
              kill -INT "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf -- "$runtime_dir"
          }
          trap cleanup EXIT

          free_dual_port() {
            python3 - <<'PY'
          import socket

          for _ in range(64):
              tcp = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              udp = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  tcp.bind(("0.0.0.0", 0))
                  port = tcp.getsockname()[1]
                  try:
                      udp.bind(("0.0.0.0", port))
                  except OSError:
                      continue
                  print(port)
                  raise SystemExit(0)
              finally:
                  tcp.close()
                  udp.close()
          raise SystemExit("Could not find a port free for both TCP and UDP/QUIC")
          PY
          }

          wait_for_health() {
            local expected_peer="${1:-}"
            for _ in $(seq 1 80); do
              if [[ -s "$health" ]] && EXPECTED_PEER="$expected_peer" python3 - "$health" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              raise SystemExit(1)
          if payload.get("schema") != 2 or payload.get("status") != "running":
              raise SystemExit(1)
          if payload.get("version") != "0.5.1":
              raise SystemExit(1)
          if payload.get("source_commit") != os.environ["EXPECTED_SOURCE_COMMIT"]:
              raise SystemExit(1)
          peer = payload.get("peer_id")
          if not isinstance(peer, str) or not peer.strip():
              raise SystemExit(1)
          expected_peer = os.environ.get("EXPECTED_PEER", "")
          if expected_peer and peer != expected_peer:
              raise SystemExit(1)
          PY
              then
                return 0
              fi
              sleep 0.25
            done
            echo 'Timed out waiting for a valid running Node health snapshot.' >&2
            cat "$log" >&2 || true
            return 1
          }

          validate_probe() {
            local transport="$1"
            local evidence_path="$2"
            local expected_peer="$3"
            EXPECTED_TRANSPORT="$transport" EXPECTED_PEER="$expected_peer" python3 - "$evidence_path" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema": 1,
              "status": "pass",
              "tool": "konofix-netprobe",
              "version": "0.5.1",
              "source_commit": os.environ["EXPECTED_SOURCE_COMMIT"],
              "transport": os.environ["EXPECTED_TRANSPORT"],
              "expected_peer_id": os.environ["EXPECTED_PEER"],
              "observed_peer_id": os.environ["EXPECTED_PEER"],
              "protocol_version": "/konofix/4.0",
              "agent_version": "Konofix-Node/0.5.1",
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f"Netprobe evidence mismatch for {key}: {payload.get(key)!r} != {value!r}")
          for key in ("rtt_micros", "elapsed_millis", "timestamp_unix"):
              value = payload.get(key)
              if type(value) is not int or value < 0:
                  raise SystemExit(f"Netprobe evidence has invalid {key}: {value!r}")
          PY
          }

          port="$(free_dual_port)"
          "$node_binary" --port "$port" --status-interval 10 --identity-file "$identity" --health-file "$health" >"$log" 2>&1 &
          pid=$!
          wait_for_health
          first_peer="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["peer_id"])' "$health")"
          kill -INT "$pid"
          wait "$pid"
          pid=''
          python3 - "$health" "$first_peer" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("status") != "stopped" or payload.get("peer_id") != sys.argv[2]:
              raise SystemExit("Node did not publish a stopped snapshot with the original Peer ID")
          PY

          : >"$log"
          rm -f -- "$health"
          port="$(free_dual_port)"
          "$node_binary" --port "$port" --status-interval 10 --identity-file "$identity" --health-file "$health" >"$log" 2>&1 &
          pid=$!
          wait_for_health "$first_peer"

          tcp_evidence="$runtime_dir/netprobe-tcp.json"
          quic_evidence="$runtime_dir/netprobe-quic.json"
          "$probe_binary" --timeout 20 "/ip4/127.0.0.1/tcp/$port/p2p/$first_peer" >"$tcp_evidence"
          validate_probe tcp "$tcp_evidence" "$first_peer"
          "$probe_binary" --timeout 20 "/ip4/127.0.0.1/udp/$port/quic-v1/p2p/$first_peer" >"$quic_evidence"
          validate_probe quic-v1 "$quic_evidence" "$first_peer"

          kill -INT "$pid"
          wait "$pid"
          pid=''
          echo "Linux runtime smoke PASS: exact source provenance, persistent Peer ID $first_peer, authenticated TCP and QUIC-v1 libp2p probes"

      - name: Linux systemd installer self-tests
        shell: bash
        run: bash scripts/test-public-node-linux.sh

      - name: Stage Linux Node bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact-linux
          mkdir -p artifact-linux/scripts artifact-linux/docs
          install -m 0755 node-linux/target/release/konofix-node artifact-linux/konofix-node
          install -m 0755 scripts/install-public-node-linux.sh artifact-linux/scripts/install-public-node-linux.sh
          cp docs/NODE.md artifact-linux/docs/NODE.md
          cp docs/NODE_SOAK.md artifact-linux/docs/NODE_SOAK.md
          cp docs/NODE_LINUX.md artifact-linux/docs/NODE_LINUX.md
          version="$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          python3 scripts/linux-bundle-provenance.py build-info \
            --root artifact-linux \
            --commit "$GITHUB_SHA" \
            --version "$version"
          tar -C artifact-linux -czf Konofix-Node-0.5.1-Linux-x86_64.tar.gz .
          sha256sum Konofix-Node-0.5.1-Linux-x86_64.tar.gz > Konofix-Node-0.5.1-Linux-x86_64.tar.gz.sha256

      - name: Verify Linux Node bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/linux-bundle-provenance.py verify \
            --archive Konofix-Node-0.5.1-Linux-x86_64.tar.gz \
            --checksum Konofix-Node-0.5.1-Linux-x86_64.tar.gz.sha256 \
            --expected-commit "$GITHUB_SHA" \
            --expected-version 0.5.1
          verify_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verify_dir"' EXIT
          tar -xzf Konofix-Node-0.5.1-Linux-x86_64.tar.gz -C "$verify_dir"
          test -x "$verify_dir/konofix-node"
          test -x "$verify_dir/scripts/install-public-node-linux.sh"
          "$verify_dir/konofix-node" --help | grep -F 'Konofix Node 0.5.1'

      - name: Upload Linux Node bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Konofix-Node-0.5.1-Linux-x86_64-${{ github.sha }}
          path: |
            artifact-linux
            Konofix-Node-0.5.1-Linux-x86_64.tar.gz
            Konofix-Node-0.5.1-Linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
