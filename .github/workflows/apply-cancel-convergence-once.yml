name: Apply cancellation convergence once

on:
  push:
    branches:
      - hardening/cancel-convergence-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Fetch verified historical patch source
        run: git fetch origin codex/cancel-state-convergence-v2:refs/remotes/origin/codex/cancel-state-convergence-v2

      - name: Apply cancellation convergence onto current main-based branch
        run: node scripts/apply-cancel-convergence-once.mjs

      - name: Restore fail-closed policy tests from the verified historical patch
        shell: bash
        run: |
          git show origin/codex/cancel-state-convergence-v2:scripts/check-file-cancel-convergence.mjs > scripts/check-file-cancel-convergence.mjs
          git show origin/codex/cancel-state-convergence-v2:scripts/test-file-cancel-convergence.mjs > scripts/test-file-cancel-convergence.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify cancellation policy and adversarial mutations
        run: |
          node scripts/test-file-cancel-convergence.mjs
          node scripts/check-file-cancel-convergence.mjs

      - name: Verify SWIR Progress SVG remains deterministic
        run: |
          node scripts/test-progress-svg.mjs
          node scripts/progress-svg.mjs --check

      - name: Run project audit
        run: npm run audit

      - name: Build frontend
        run: npm run build

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Verify diff integrity
        run: git diff --check

      - name: Remove one-shot helper and commit verified patch
        shell: bash
        run: |
          rm -f .github/workflows/apply-cancel-convergence-once.yml scripts/apply-cancel-convergence-once.mjs
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          git config user.name "SWIR CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Converge file-transfer cancellation on current main"
          git push origin HEAD:hardening/cancel-convergence-v3
