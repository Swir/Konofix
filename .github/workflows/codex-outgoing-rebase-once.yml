name: One-shot outgoing disconnect cleanup integration

on:
  push:
    branches:
      - codex/outgoing-disconnect-cleanup-v2

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Bring reviewed liveness policy and security documentation onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/codex/outgoing-disconnect-cleanup:refs/remotes/origin/codex/outgoing-disconnect-cleanup
          git show origin/codex/outgoing-disconnect-cleanup:scripts/check-file-transfer-liveness.mjs > scripts/check-file-transfer-liveness.mjs
          git show origin/codex/outgoing-disconnect-cleanup:scripts/test-file-transfer-liveness.mjs > scripts/test-file-transfer-liveness.mjs
          git show origin/codex/outgoing-disconnect-cleanup:docs/FILE_TRANSFER_SECURITY.md > docs/FILE_TRANSFER_SECURITY.md

      - name: Apply outgoing disconnect cleanup and synchronize changelog/roadmap
        shell: python
        run: |
          from pathlib import Path

          lib = Path('src-tauri/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          connection = 'SwarmEvent::ConnectionClosed { peer_id: remote, num_established, .. } => {'
          status = 'emit_status(&app, &mut swarm, bootstrap_count, &nat_status, &listen_addresses, "Połączenie z peerem zamknięte");'
          outgoing_marker = 'let outgoing_from_peer: Vec<String> = outgoing'
          if outgoing_marker in text:
              raise SystemExit('Outgoing disconnect cleanup already exists on latest main; refusing duplicate integration.')
          start = text.find(connection)
          if start < 0:
              raise SystemExit('ConnectionClosed handler not found.')
          status_at = text.find(status, start)
          if status_at < 0:
              raise SystemExit('ConnectionClosed status marker not found.')
          close_at = text.rfind('\n                    }', start, status_at)
          if close_at < 0:
              raise SystemExit('Final num_established guard close not found.')
          insertion = '''

                          let outgoing_from_peer: Vec<String> = outgoing
                              .iter()
                              .filter(|(_, candidate)| candidate.peer == remote)
                              .map(|(id, _)| id.clone())
                              .collect();
                          outbound_requests.retain(|_, meta| !outgoing_from_peer.contains(&meta.transfer_id));
                          for transfer_id in outgoing_from_peer {
                              if let Some(transfer) = outgoing.remove(&transfer_id) {
                                  emit_transfer(
                                      &app,
                                      &file_view_outgoing(
                                          &transfer_id,
                                          &transfer,
                                          "failed",
                                          None,
                                          Some("Peer disconnected before the outgoing file transfer completed.".into()),
                                      ),
                                  );
                              }
                          }
          '''
          lib.write_text(text[:close_at] + insertion + text[close_at:], encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          bullet = '- hardened outgoing file-transfer liveness on final peer disconnect: once `num_established == 0`, sender-side transfers owned by that Peer ID are reclaimed immediately, emit a deterministic failed terminal state, and prune only matching request/response metadata so unrelated transfers remain intact; adversarial policy coverage protects final-connection, peer-ownership and scoped-pruning invariants, and this local resilience hardening adds no Real Internet Test credit,\n'
          if bullet not in text:
              anchor = '## 0.4.2\n\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'Expected one 0.4.2 changelog anchor, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + bullet, 1)
              changelog.write_text(text, encoding='utf-8')

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          note = '- Outgoing file transfers now converge immediately when the final connection to their authenticated remote Peer ID closes: only that peer\'s sender-side transfer slots are reclaimed, matching outbound request metadata is pruned so late responses are ignored, and unrelated peer/request state remains untouched. Adversarial liveness coverage guards the final-connection and peer-ownership boundaries; this local resilience hardening does not add Real Internet Test credit and the milestone remains 54/59.\n'
          if note not in text:
              start_marker = '- Accepted incoming file transfers now have a 120-second inactivity lease'
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit('Accepted incoming transfer roadmap hardening note not found.')
              end = text.find('\n', start)
              if end < 0:
                  raise SystemExit('Roadmap hardening note line is unterminated.')
              text = text[:end + 1] + note + text[end + 1:]
              roadmap.write_text(text, encoding='utf-8')

      - name: Format and verify scoped invariants
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          node scripts/test-file-transfer-liveness.mjs
          node scripts/check-file-transfer-liveness.mjs
          node scripts/test-bootstrap-persistence.mjs
          node scripts/check-bootstrap-persistence.mjs
          node scripts/test-progress-svg.mjs
          node scripts/progress-svg.mjs --check
          grep -F "54 of 59 tasks — 91.5%." ROADMAP.md
          git diff --check

      - name: Commit integrated change and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/codex-outgoing-rebase-once.yml
          git add src-tauri/src/lib.rs scripts/check-file-transfer-liveness.mjs scripts/test-file-transfer-liveness.mjs docs/FILE_TRANSFER_SECURITY.md CHANGELOG.md ROADMAP.md
          git diff --cached --check
          git commit -m "Reclaim outgoing transfers on final peer disconnect"
          git push origin HEAD:codex/outgoing-disconnect-cleanup-v2
