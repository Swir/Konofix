version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      # Low-risk maintenance can share one review/build cycle. Major upgrades
      # stay ungrouped so a toolchain break has one dependency-sized blast radius.
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep the desktop and isolated headless Node manifests on one update surface.
  # Minor/patch maintenance can move together. Major upgrades are grouped by
  # dependency name so each breaking dependency gets one PR that updates both
  # mirrored manifests instead of two parity-breaking directory-specific PRs.
  - package-ecosystem: "cargo"
    directories:
      - "/src-tauri"
      - "/node-linux"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"
      serde-major:
        patterns:
          - "serde"
        update-types:
          - "major"
      serde-json-major:
        patterns:
          - "serde_json"
        update-types:
          - "major"
      tokio-major:
        patterns:
          - "tokio"
        update-types:
          - "major"
      futures-major:
        patterns:
          - "futures"
        update-types:
          - "major"
      uuid-major:
        patterns:
          - "uuid"
        update-types:
          - "major"
      slug-major:
        patterns:
          - "slug"
        update-types:
          - "major"
      unicode-normalization-major:
        patterns:
          - "unicode-normalization"
        update-types:
          - "major"
      sha2-major:
        patterns:
          - "sha2"
        update-types:
          - "major"
      hex-major:
        patterns:
          - "hex"
        update-types:
          - "major"
      dirs-major:
        patterns:
          - "dirs"
        update-types:
          - "major"
      libp2p-major:
        patterns:
          - "libp2p"
        update-types:
          - "major"
      tauri-build-major:
        patterns:
          - "tauri-build"
        update-types:
          - "major"
      tauri-major:
        patterns:
          - "tauri"
        update-types:
          - "major"
      rfd-major:
        patterns:
          - "rfd"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      # Major Action runtime changes (for example Node runtime jumps) are
      # intentionally reviewed one at a time just like application toolchains.
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
