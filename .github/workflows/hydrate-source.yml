name: Hydrate Konofix source

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/part_*'
      - '.github/workflows/hydrate-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and verify Konofix Chat 0.4.1 archive
        id: recover
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import io
          import zipfile

          root = Path('.bootstrap')
          text = []
          for i in range(8):
              p = root / f'part_{i:02d}'
              if not p.is_file():
                  raise SystemExit(f'Missing bootstrap part: {p}')
              text.append(p.read_text(encoding='ascii').replace('\r', '').replace('\n', ''))

          head_b64 = ''.join(text[:6]) + text[6][:8000]
          broken = text[6][8000:]
          tail_b64 = text[7]
          diag = root / 'repair-result.txt'

          if (len(head_b64), len(broken), len(tail_b64)) != (56000, 2575, 2584):
              diag.write_text(
                  f'Unexpected layout: head={len(head_b64)} broken={len(broken)} tail={len(tail_b64)}\n',
                  encoding='utf-8'
              )
              raise SystemExit(diag.read_text())

          head = base64.b64decode(head_b64, validate=True)
          tail = base64.b64decode(tail_b64, validate=True)
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          required = {
              'README.md','ROADMAP.md','CHANGELOG.md','src/main.ts',
              'src-tauri/Cargo.toml','src-tauri/src/lib.rs',
              'src-tauri/src/bin/konofix-node.rs',
          }

          successes = []
          parseable = 0
          crc_checked = 0
          for pos in range(len(broken) + 1):
              left, right = broken[:pos], broken[pos:]
              for ch in alphabet:
                  try:
                      middle = base64.b64decode(left + ch + right, validate=True)
                  except Exception:
                      continue
                  blob = head + middle + tail
                  if not blob.startswith(b'PK\x03\x04') or b'PK\x05\x06' not in blob[-128:]:
                      continue
                  try:
                      with zipfile.ZipFile(io.BytesIO(blob), 'r') as zf:
                          names = set(zf.namelist())
                          parseable += 1
                          if not required.issubset(names):
                              continue
                          crc_checked += 1
                          if zf.testzip() is not None:
                              continue
                  except Exception:
                      continue
                  successes.append((pos, ch, blob))
                  if len(successes) > 1:
                      break
              if len(successes) > 1:
                  break

          if len(successes) != 1:
              diag.write_text(
                  'Konofix bootstrap recovery did not produce one unique valid archive.\n'
                  f'head_chars={len(head_b64)}\n'
                  f'broken_chars={len(broken)}\n'
                  f'tail_chars={len(tail_b64)}\n'
                  f'parseable_candidates={parseable}\n'
                  f'crc_checked_candidates={crc_checked}\n'
                  f'valid_candidates={len(successes)}\n',
                  encoding='utf-8'
              )
              raise SystemExit(diag.read_text())

          pos, ch, blob = successes[0]
          Path('/tmp/konofix-source.zip').write_bytes(blob)
          diag.write_text(
              'Konofix Chat bootstrap recovered and CRC-verified.\n'
              f'insert_position_in_damaged_segment={pos}\n'
              f'inserted_base64_character={ch}\n'
              f'archive_bytes={len(blob)}\n',
              encoding='utf-8'
          )
          print(diag.read_text())
          PY

          unzip -t /tmp/konofix-source.zip
          rm -rf /tmp/konofix-source
          mkdir -p /tmp/konofix-source
          unzip -q /tmp/konofix-source.zip -d /tmp/konofix-source
          test -f /tmp/konofix-source/src-tauri/Cargo.toml
          test -f /tmp/konofix-source/src/main.ts
          test -f /tmp/konofix-source/ROADMAP.md

      - name: Commit recovery diagnostic when needed
        if: steps.recover.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bootstrap/repair-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Konofix bootstrap recovery diagnostic"
            git push origin HEAD:main
          fi

      - name: Fail safely if recovery failed
        if: steps.recover.outcome == 'failure'
        run: exit 1

      - name: Replace bootstrap with full project source
        if: steps.recover.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          for item in /tmp/konofix-source/*; do
            cp -a "$item" ./
          done
          rm -rf .bootstrap
          rm -f .github/workflows/hydrate-source.yml

      - name: Commit hydrated Konofix Chat source
        if: steps.recover.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Import full Konofix Chat 0.4.1 source"
          git push origin HEAD:main
