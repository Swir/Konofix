name: Clean public-host integration artifacts

on:
  push:
    branches: [ automation/public-host-policy-86 ]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/public-host-policy-86
          fetch-depth: 0

      - name: Remove generated build artifacts and helper
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch node-linux/target
          git rm .github/workflows/automation-clean-public-host-86.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove generated Node build artifacts"
          git push origin HEAD:automation/public-host-policy-86
