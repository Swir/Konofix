name: Hydrate Konofix source

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/part_*'
      - '.github/workflows/hydrate-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover files from ZIP local records
        id: recover
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import binascii
          import struct
          import zlib

          bootstrap = Path('.bootstrap')
          diag = bootstrap / 'repair-result.txt'
          pieces = []
          for i in range(8):
              p = bootstrap / f'part_{i:02d}'
              if not p.is_file():
                  raise SystemExit(f'Missing {p}')
              pieces.append(p.read_text(encoding='ascii').replace('\r','').replace('\n',''))

          joined = ''.join(pieces)
          # The damaged Base64 is valid through the beginning of the broken
          # final quantum. All ZIP local file records precede that damage.
          first_pad = joined.find('=')
          if first_pad < 0:
              usable_chars = len(joined) - (len(joined) % 4)
          else:
              usable_chars = first_pad - (first_pad % 4)
          encoded_prefix = joined[:usable_chars]
          raw = base64.b64decode(encoded_prefix, validate=True)

          out = Path('/tmp/konofix-source')
          if out.exists():
              import shutil
              shutil.rmtree(out)
          out.mkdir(parents=True)

          LOCAL = b'PK\x03\x04'
          CENTRAL = b'PK\x01\x02'
          EOCD = b'PK\x05\x06'
          pos = 0
          recovered = []
          errors = []

          while pos + 4 <= len(raw):
              sig = raw[pos:pos+4]
              if sig in (CENTRAL, EOCD):
                  break
              if sig != LOCAL:
                  errors.append(f'unexpected_signature_at={pos}: {sig.hex()}')
                  break
              if pos + 30 > len(raw):
                  errors.append(f'truncated_local_header_at={pos}')
                  break

              (signature, version, flags, method, mtime, mdate, crc32_expected,
               compressed_size, uncompressed_size, name_len, extra_len) = struct.unpack_from(
                  '<IHHHHHIIIHH', raw, pos
              )
              header_end = pos + 30
              name_start = header_end
              name_end = name_start + name_len
              extra_end = name_end + extra_len
              if extra_end > len(raw):
                  errors.append(f'truncated_name_or_extra_at={pos}')
                  break

              name_bytes = raw[name_start:name_end]
              encoding = 'utf-8' if flags & 0x800 else 'cp437'
              name = name_bytes.decode(encoding, errors='strict')

              if flags & 0x08:
                  errors.append(f'data_descriptor_not_supported:{name}')
                  break

              data_start = extra_end
              data_end = data_start + compressed_size
              if data_end > len(raw):
                  errors.append(f'truncated_data:{name}')
                  break
              compressed = raw[data_start:data_end]

              if method == 0:
                  data = compressed
              elif method == 8:
                  data = zlib.decompress(compressed, -15)
              else:
                  errors.append(f'unsupported_compression_{method}:{name}')
                  break

              actual_crc = binascii.crc32(data) & 0xffffffff
              if actual_crc != crc32_expected:
                  errors.append(
                      f'crc_mismatch:{name}: expected={crc32_expected:08x} actual={actual_crc:08x}'
                  )
                  break
              if len(data) != uncompressed_size:
                  errors.append(
                      f'size_mismatch:{name}: expected={uncompressed_size} actual={len(data)}'
                  )
                  break

              pure = PurePosixPath(name)
              if pure.is_absolute() or '..' in pure.parts:
                  errors.append(f'unsafe_path:{name}')
                  break
              target = out.joinpath(*pure.parts)
              if name.endswith('/'):
                  target.mkdir(parents=True, exist_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              recovered.append(name)
              pos = data_end

          required = {
              'README.md',
              'ROADMAP.md',
              'CHANGELOG.md',
              'package.json',
              'src/main.ts',
              'src/style.css',
              'src-tauri/Cargo.toml',
              'src-tauri/src/lib.rs',
              'src-tauri/src/main.rs',
              'src-tauri/src/bin/konofix-node.rs',
              '.github/workflows/windows-ci.yml',
          }
          missing = sorted(required - set(recovered))

          report = [
              'Konofix Chat local-record recovery',
              f'joined_base64_chars={len(joined)}',
              f'usable_base64_chars={usable_chars}',
              f'decoded_prefix_bytes={len(raw)}',
              f'recovered_entries={len(recovered)}',
              f'stop_offset={pos}',
              f'next_signature={raw[pos:pos+4].hex() if pos+4 <= len(raw) else "EOF"}',
          ]
          report += [f'file={x}' for x in recovered]
          report += [f'error={x}' for x in errors]
          report += [f'missing={x}' for x in missing]
          diag.write_text('\n'.join(report) + '\n', encoding='utf-8')
          print(diag.read_text())

          if errors or missing:
              raise SystemExit('Recovery validation failed; see repair-result.txt')
          if len(recovered) < 20:
              raise SystemExit(f'Refusing incomplete recovery: only {len(recovered)} entries')
          PY

      - name: Commit recovery diagnostic when needed
        if: steps.recover.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bootstrap/repair-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record ZIP local-record recovery diagnostic"
            git push origin HEAD:main
          fi

      - name: Fail safely if recovery failed
        if: steps.recover.outcome == 'failure'
        run: exit 1

      - name: Replace bootstrap with recovered full source
        if: steps.recover.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          for item in /tmp/konofix-source/*; do
            cp -a "$item" ./
          done
          rm -rf .bootstrap
          rm -f .github/workflows/hydrate-source.yml

      - name: Commit full Konofix Chat 0.4.1 source
        if: steps.recover.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full Konofix Chat 0.4.1 source"
          git push origin HEAD:main
