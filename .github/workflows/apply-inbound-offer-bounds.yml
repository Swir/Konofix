name: Apply inbound offer wire bounds

on:
  push:
    branches:
      - security/inbound-file-offer-wire-bounds

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run inbound offer bounds patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: python scripts/apply-inbound-offer-bounds.py
      - name: Format Rust source
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit focused implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Bound inbound file-offer wire metadata"
          git push origin HEAD:security/inbound-file-offer-wire-bounds
